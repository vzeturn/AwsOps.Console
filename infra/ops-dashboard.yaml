          DOWNSIZE_SCHEDULER_FUNCTION_ARN: !GetAtt DownsizeSchedulerFunction.Arn
          DOWNSIZE_SCHEDULER_INVOKE_ROLE_ARN: !GetAtt DownsizeSchedulerInvokeRole.Arn
      Tags:
        - { Key: Environment, Value: !Ref Environment }
        - { Key: Project, Value: !Ref Project }
        - { Key: Lifecycle, Value: active }
        - { Key: Owner, Value: platform }

  ScheduledActionsMutateFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${ScheduledActionsMutateFunction}'
      RetentionInDays: 30

  ScheduledActionsMutateFunctionErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${Org}-${Project}-${Environment}-action-schedule-mutate-fn-errors'
      AlarmDescription: 'ScheduledActionsMutateFunction Errors >= 1 in one cycle - check CloudWatch Logs.'
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref ScheduledActionsMutateFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
