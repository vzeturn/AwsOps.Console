      AlarmDescription: 'ApprovalMutateFunction Errors >= 1 in one cycle - check CloudWatch Logs.'
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref ApprovalMutateFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmNotificationTopic
      OKActions:
        - !Ref AlarmNotificationTopic

  # EventBridge Rule (not EventBridge Scheduler): listens for EVERY EC2 instance in the account
  # moving to state "stopped" (source aws.ec2, "EC2 Instance State-change Notification", see the AWS
  # docs "State change events for Amazon EC2 instances"). The handler filters and only processes
  # instances that carry the PendingAutoRightsize tag (set by InfraReviewCollectorFunction). Every
  # other EC2 stop in the account triggers this Lambda too, but it exits at the tag check without
  # mutating anything.
  Ec2RightsizeApplierRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub '${Org}-${Project}-${Environment}-governance-rightsize-applier'
      Description: Trigger ec2-rightsize-applier-fn when any EC2 instance enters the stopped state.
      EventPattern:
        source: [aws.ec2]
        'detail-type': ['EC2 Instance State-change Notification']
        detail:
          state: [stopped]
      State: ENABLED
      Targets:
        - Arn: !GetAtt Ec2RightsizeApplierFunction.Arn
          Id: ec2-rightsize-applier-target

  Ec2RightsizeApplierEventPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref Ec2RightsizeApplierFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt Ec2RightsizeApplierRule.Arn

  # --- IAM: action-execution-fn (the minimal mutate/read-only set per Resource_Action; no
  # statement duplicates RouterRole). ---
  ActionExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${Org}-${Project}-${Environment}-action-execution-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: ebs-snapshot-and-delete
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: EbsSnapshotAndDelete
                Effect: Allow
                Action: [ec2:CreateSnapshot, ec2:DeleteVolume]
                Resource:
                  - !Sub 'arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:volume/*'
                  # ec2:CreateSnapshot is authorized against the ARN of the NEW snapshot (which does
                  # not exist yet at authorization time). AWS uses an ARN WITHOUT an AccountId in this
                  # case ("arn:aws:ec2:<region>::snapshot/*", two adjacent ':'), unlike
                  # ec2:DeleteVolume/permissions on existing snapshots (which always include it).
                  - !Sub 'arn:aws:ec2:${AWS::Region}::snapshot/*'
                  - !Sub 'arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:snapshot/*'
              - Sid: EbsDescribeReadOnly
                Effect: Allow
                # ec2:DescribeSnapshots is needed to poll the state of the snapshot just created
                # ('completed'/'error') before calling DeleteVolume, see waitForSnapshotCompleted()
                # in ebs-action-service.ts. Without it CreateSnapshot succeeds but the state cannot
                # be polled.
                Action: [ec2:DescribeVolumes, ec2:DescribeSnapshots]
                Resource: '*'
        - PolicyName: s3-lifecycle-apply
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: S3LifecycleApply
                Effect: Allow
                # The correct IAM ACTION name is "s3:PutLifecycleConfiguration" (no "Bucket"), see the
                # full comment on the S3LifecycleReadOnlyForPreview statement above (RouterRole).
                Action: s3:PutLifecycleConfiguration
                Resource: 'arn:aws:s3:::*'
              - Sid: S3LifecycleReadOnly
                Effect: Allow
                Action: s3:GetLifecycleConfiguration
                Resource: 'arn:aws:s3:::*'
        - PolicyName: ec2-state-manager-service-token
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: Ec2StateManagerServiceToken
                Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${Ec2StateManagerServiceTokenParamName}'
              # SecureString requires kms:Decrypt separately from ssm:GetParameter, scoped via
              # kms:ViaService (see DecryptClaudeApiKeyViaSsmOnly above for the same pattern).
              - Sid: DecryptEc2StateManagerServiceTokenViaSsmOnly
                Effect: Allow
                Action: kms:Decrypt
                Resource: '*'
                Condition:
                  StringEquals:
                    kms:ViaService: !Sub 'ssm.${AWS::Region}.amazonaws.com'
        - PolicyName: action-audit-write-read
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ActionAuditReadWrite
                Effect: Allow
                Action: [s3:PutObject, s3:GetObject, s3:ListBucket]
                Resource:
                  - !GetAtt AssessmentReportBucket.Arn
                  - !Sub '${AssessmentReportBucket.Arn}/action-audit/*'
        # --- ECS_ScaleOut (Resource_Action, quick action from the "high CPU/Memory" runbook on the
        # Monitoring page): only ecs:UpdateService (mutate) + ecs:DescribeServices (re-read before
        # mutating, defense in depth) + application-autoscaling:DescribeScalableTargets (read the
        # registered MaxCapacity; NO permission to register/modify scalable targets or scaling
        # policies). ---
        - PolicyName: ecs-scale-out
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: EcsUpdateServiceAndDescribe
                Effect: Allow
                Action: [ecs:UpdateService, ecs:DescribeServices]
                Resource: !Sub 'arn:aws:ecs:${AWS::Region}:${AWS::AccountId}:service/*'
              - Sid: EcsAutoScalingReadOnly
                Effect: Allow
                Action: application-autoscaling:DescribeScalableTargets
                Resource: '*'
        # --- RDS_IncreaseStorage (Resource_Action, quick action from the "low FreeStorageSpace"
        # runbook on the Monitoring page): only rds:ModifyDBInstance (mutate, AllocatedStorage only,
        # see rds-storage-action-service.ts, no other field) + rds:DescribeDBInstances (re-read
        # before mutating). ---
        - PolicyName: rds-increase-storage
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: RdsModifyAndDescribe
                Effect: Allow
                Action: [rds:ModifyDBInstance, rds:DescribeDBInstances]
                Resource: !Sub 'arn:aws:rds:${AWS::Region}:${AWS::AccountId}:db:*'
        # --- EBS_ModifyVolumeType (finding ebsVolumeGp2ShouldBeGp3 on the Assessment/
        # Recommendation detail pages): only ec2:ModifyVolume (mutate, changes VolumeType) +
        # ec2:DescribeVolumes (re-read before mutating, defense in depth). ---
        - PolicyName: ebs-modify-volume-type
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: EbsModifyVolumeTypeAndDescribe
                Effect: Allow
                Action: [ec2:ModifyVolume, ec2:DescribeVolumes]
                Resource: !Sub 'arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:volume/*'
        # --- CloudWatchLogGroup_SetRetention (finding cloudWatchLogGroupNoRetention): only
        # logs:PutRetentionPolicy (mutate). A log-group ARN needs a trailing ":*" for most API
        # actions (except Tag/Untag/ListTags, see the CloudWatch Logs permissions reference);
        # "arn:...:log-group:*" (without the trailing ":*") does NOT match the real ARN of a specific
        # log group. logs:DescribeLogGroups uses Resource "*" because it only supports listing and no
        # resource-level permission per log group. ---
        - PolicyName: cloudwatch-log-retention
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: LogsPutRetentionPolicy
                Effect: Allow
                Action: logs:PutRetentionPolicy
                Resource: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:*:*'
              - Sid: LogsDescribeReadOnly
                Effect: Allow
                Action: logs:DescribeLogGroups
                Resource: '*'
        # --- ElasticIp_Release (finding elasticIpUnused): ec2:ReleaseAddress (mutate, irreversible)
        # scoped by the resource type ARN "elastic-ip/*" (supports resource-level permissions, see
        # the AWS IAM Actions/Resources reference for EC2). ec2:DescribeAddresses (re-read before
        # mutating) uses Resource: "*" because Describe* actions do not support resource-level
        # permissions (a known AWS limitation, same pattern as the existing EbsDescribeReadOnly). ---
        - PolicyName: elastic-ip-release
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ElasticIpRelease
                Effect: Allow
                Action: ec2:ReleaseAddress
                Resource: !Sub 'arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:elastic-ip/*'
              - Sid: ElasticIpDescribeReadOnly
                Effect: Allow
                Action: ec2:DescribeAddresses
                Resource: '*'
        # --- EC2_Rightsize (finding ec2LowCpu on the Assessment page/Recommendation detail modal):
        # ec2:ModifyInstanceAttribute (mutate, changes InstanceType only) scoped to the instance/*
        # ARN + ec2:DescribeInstances/ec2:DescribeInstanceTypes (re-read before mutating + check
        # real CPU architecture compatibility, see ec2Rightsizing.ts/ec2-rightsize-action-service.ts).
        # Both Describe actions use Resource: '*' because AWS has no resource-level permission for
        # DescribeInstanceTypes (it applies to an instance TYPE, not a specific instance), and
        # DescribeInstances already uses Resource:'*' in RouterRole/InfraReviewCollectorRole. Stop/start
        # still goes through the external state-manager service (the Ec2StateManagerServiceToken
        # statement exists in another policy above), so no StartInstances/StopInstances permission
        # is needed here. ---
        - PolicyName: ec2-rightsize
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: Ec2RightsizeModifyAttribute
                Effect: Allow
                # NOTE: this statement also covers the Groups parameter (used by
                # Ec2_ModifySecurityGroups). IAM cannot distinguish sub-parameters of the same
                # action, so no separate statement is needed for Groups. This is intentional.
                Action: ec2:ModifyInstanceAttribute
                Resource: !Sub 'arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:instance/*'
              - Sid: Ec2RightsizeDescribeReadOnly
                Effect: Allow
                Action: [ec2:DescribeInstances, ec2:DescribeInstanceTypes]
                Resource: '*'
        # --- BackupVault_ApplyProtectionPolicy (finding backupVaultNotProtected on the Assessment
        # page): only backup:PutBackupVaultAccessPolicy (mutate, OVERWRITES the whole policy, see
        # backup-vault-protection-action-service.ts, which MUST read the policy first to preserve
        # other statements) + backup:GetBackupVaultAccessPolicy (read before/after mutating, both to
        # merge the policy and to confirm the protection is really in effect). Backup vaults do not
        # support resource-level permissions for these 2 actions (an AWS Backup access policy is a
        # resource-based policy defined per vault, unlike normal identity-based scoping), so
        # Resource: '*' is used, the same pattern as the other Backup actions in
        # InfraReviewCollectorRole (backup:GetBackupVaultAccessPolicy/ListBackupVaults). ---
        - PolicyName: backup-vault-apply-protection-policy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: BackupVaultAccessPolicyReadWrite
                Effect: Allow
                Action: [backup:PutBackupVaultAccessPolicy, backup:GetBackupVaultAccessPolicy]
                Resource: '*'
        # --- BackupRestoreTesting_CreatePlan (finding restoreTestingNotConfigured, account-wide):
        # backup:CreateRestoreTestingPlan + backup:CreateRestoreTestingSelection (mutate, see
        # backup-restore-testing-action-service.ts) + backup:ListRestoreTestingPlans (read before
        # mutating, idempotency check). iam:PassRole is scoped to EXACTLY 1 role ARN,
        # AWSBackupDefaultServiceRole (NO wildcard "*"): AWS Backup needs it to "borrow" that role when
        # creating a restore testing selection (RestoreTestingSelectionForCreate.IamRoleArn), per the
        # standard least-privilege PassRole principle ("Grant a user permissions to pass a role to an
        # AWS service" in the IAM User Guide). PassRole is not granted for any other role. ---
        - PolicyName: backup-restore-testing-create-plan
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: BackupRestoreTestingCreateAndDescribe
                Effect: Allow
                Action: [backup:CreateRestoreTestingPlan, backup:CreateRestoreTestingSelection, backup:ListRestoreTestingPlans]
                Resource: '*'
              # iam:PassedToService for CreateRestoreTestingSelection IS
              # "restore-testing.backup.amazonaws.com" (the service principal of
              # AWSServiceRoleForBackupRestoreTesting, see the AWS doc
              # "using-service-linked-roles-AWSServiceRoleForBackupRestoreTesting.html"), unlike
              # StartBackupJob, which uses plain "backup.amazonaws.com". Both values are listed in one
              # statement (StringEquals with a list) so backup-restore-testing-create-plan
              # (CreateRestoreTestingSelection) AND backup-retry-job (StartBackupJob) share it
              # without repeating the PassRole statement.
              - Sid: PassRoleForBackupDefaultServiceRole
                Effect: Allow
                Action: iam:PassRole
                Resource: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/service-role/AWSBackupDefaultServiceRole'
                Condition:
                  StringEquals:
                    iam:PassedToService:
                      - backup.amazonaws.com
                      - restore-testing.backup.amazonaws.com
        # --- Backup_RetryJob (finding backupJobFailed: re-run a backup job on demand for a missing
        # recovery point): backup:StartBackupJob (mutate) + backup:ListBackupJobs (read the most
        # recent backup job to find the vault/role actually used, see
        # backup-retry-job-action-service.ts; nothing is guessed). StartBackupJob needs no extra
        # PassRole of its own beyond what is described next: the IamRoleArn passed to it is the role
        # AWS Backup already used for that resource (ActionExecutionRole only forwards the value it
        # read and never picks a new role), but the StartBackupJob API still requires the caller to
        # have iam:PassRole for the passed role. It is the same AWSBackupDefaultServiceRole as above,
        # so the PassRoleForBackupDefaultServiceRole statement is reused. ---
        - PolicyName: backup-retry-job
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: BackupStartJobAndListJobs
                Effect: Allow
                Action: [backup:StartBackupJob, backup:ListBackupJobs]
                Resource: '*'
        # --- RDS_ApplyResourceGovernance (finding rdsResourceGovernanceMissing: a report or one
        # feature must not starve other functions/services of resources): rds:ModifyDBParameterGroup
        # (mutate, changes parameter VALUES only, see rds-resource-governance-action-service.ts, no
        # parameter group is deleted or re-created) + rds:DescribeDBInstances/DescribeDBParameters
        # (read before mutating). For all 3 actions AWS has no resource-level permission for DB
        # Parameter Groups (an ARN of the form arn:aws:rds:<region>:<account>:pg:<name> exists, but
        # ModifyDBParameterGroup/DescribeDBParameters are not in the list of actions that support
        # resource-level permissions in the AWS IAM Actions/Resources reference for RDS), so
        # Resource: '*' is used for all 3, same pattern as EC2_Rightsize (DescribeInstanceTypes)
        # above. ---
        - PolicyName: rds-apply-resource-governance
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: RdsModifyParameterGroupAndDescribe
                Effect: Allow
                Action: [rds:ModifyDBParameterGroup, rds:DescribeDBInstances, rds:DescribeDBParameters]
                Resource: '*'
        - PolicyName: ec2-reboot
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: Ec2Reboot
                Effect: Allow
                Action: ec2:RebootInstances
                Resource: !Sub 'arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:instance/*'
              - Sid: Ec2DescribeReadOnlyForReboot
                Effect: Allow
                Action: ec2:DescribeInstances
                Resource: '*'
        - PolicyName: rds-lifecycle-actions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: RdsLifecycleAndDescribe
                Effect: Allow
                Action:
                  - rds:StartDBInstance
                  - rds:StopDBInstance
                  - rds:RebootDBInstance
                  - rds:DescribeDBInstances
                Resource: !Sub 'arn:aws:rds:${AWS::Region}:${AWS::AccountId}:db:*'
        # --- Security Group ingress. Two separate statements because their Resource scopes differ
        # (they cannot be merged):
        #  1. SecurityGroupIngressMutate: Authorize/Revoke support resource-level permissions, so it
        #     is limited to security groups of THIS account + region. It cannot be narrowed further
        #     by ARN because the set of editable SGs is operational data (it changes continuously),
        #     not an infrastructure constant; the real gate is in the application layer: operator
        #     RBAC + rule validation + audit log. Ingress ONLY; egress is NOT granted here (no
        #     excess permission).
        #  2. SecurityGroupDescribeReadOnlyForMutate: re-reads SG state RIGHT BEFORE mutating
        #     (defense in depth, the preview data may be stale). ec2:Describe* does not support
        #     resource-level permissions, so Resource:'*' is required (same reason as in
        #     RouterRole). ---
        - PolicyName: security-group-ingress
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: SecurityGroupIngressMutate
                Effect: Allow
                Action:
                  - ec2:AuthorizeSecurityGroupIngress
                  - ec2:RevokeSecurityGroupIngress
                Resource: !Sub 'arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:security-group/*'
              - Sid: SecurityGroupDescribeReadOnlyForMutate
                Effect: Allow
                Action: ec2:DescribeSecurityGroups
                Resource: '*'
        # --- SSM_RunPreset (Linux + Windows): runs 1 of 5 fixed READ-ONLY diagnostic presets that
        # live in code (shared/src/ssmRunPresets.ts) on one EC2 instance. Each preset has 2 literal
        # command variants (Linux via AWS-RunShellScript, Windows via AWS-RunPowerShellScript); the
        # service picks the variant from the PlatformType read from DescribeInstanceInformation,
        # NEVER from the request. 3 separate statements because their Resource scopes differ (they
        # cannot be merged):
        #  1. SsmSendCommandRunShellScriptOnly: SendCommand supports resource-level permissions, so
        #     it is scoped to EXACTLY the two fixed documents (AWS-RunShellScript for Linux,
        #     AWS-RunPowerShellScript for Windows) + instances of this account+region. This is the
        #     SECOND DEFENSE LAYER for the invariant "there is never a free-text command": even if a
        #     future bug let a documentName through from the request, IAM would still block every
        #     other document (AWS-RunPatchBaseline, custom documents...), so no path exists for an
        #     arbitrary documentName from a request. Same pattern as PatchSchedulerRole (scope
        #     arn:aws:ssm:<region>::document/<name>).
        #  2. SsmDescribeInstanceInformationForPreflight: re-checks that the instance is an Online
        #     SSM-managed node RIGHT BEFORE sending the command (defense in depth; action-execution-fn
        #     cannot read the infra cache, so it cannot repeat the router's check). This API does not
        #     support resource-level ARNs, so Resource:'*' is required.
        #  3. SsmGetCommandInvocationForResultCheck: same Resource:'*' reason as above. Granted here
        #     so the execution layer can self-check the result when needed; it is NOT the UI poll
        #     path (that lives in RouterRole). ---
        - PolicyName: ssm-run-preset
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: SsmSendCommandRunShellScriptOnly
                Effect: Allow
                Action: ssm:SendCommand
                Resource:
                  - !Sub 'arn:aws:ssm:${AWS::Region}::document/AWS-RunShellScript'
                  - !Sub 'arn:aws:ssm:${AWS::Region}::document/AWS-RunPowerShellScript'
                  - !Sub 'arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:instance/*'
              - Sid: SsmDescribeInstanceInformationForPreflight
                Effect: Allow
                Action: ssm:DescribeInstanceInformation
                Resource: '*'
              - Sid: SsmGetCommandInvocationForResultCheck
                Effect: Allow
                Action: ssm:GetCommandInvocation
                Resource: '*'
        # --- EC2 Tag Management: CreateTags/DeleteTags have NO TagKeys condition, unlike the
        # automation statements above (patch-scheduler, rightsize marker) that pin aws:TagKeys to a
        # fixed set of keys. Users must be able to write ARBITRARY keys (beyond the reserved ones),
        # so the real enforcement lives in the application layer (the RESERVED_TAG_KEYS guardrail in
        # ec2-tags-action-service.ts), not in an IAM condition. This is intentional. ---
        - PolicyName: ec2-tag-management
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: Ec2CreateDeleteTags
                Effect: Allow
                Action:
                  - ec2:CreateTags
                  - ec2:DeleteTags
                Resource: !Sub 'arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:instance/*'
        # --- Security Group egress: mirrors the Authorize/RevokeIngress statement above exactly,
        # only for the Egress APIs. ---
        - PolicyName: security-group-egress
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: SecurityGroupEgressMutate
                Effect: Allow
                Action:
                  - ec2:AuthorizeSecurityGroupEgress
                  - ec2:RevokeSecurityGroupEgress
                Resource: !Sub 'arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:security-group/*'
        # --- Security Group lifecycle: create/delete Security Groups.
        # CreateSecurityGroup does not support resource-level permission scoping in AWS IAM (the
        # GroupId does not exist yet when IAM evaluates, so there is no ARN pattern to match); the AWS
        # IAM Actions/Resources reference does not list CreateSecurityGroup among actions supporting
        # resource-level scoping, and AWS's own examples use Resource: '*'. DeleteSecurityGroup, on the
        # other hand, DOES support resource-level scoping (the GroupId exists), so the
        # Ec2DeleteSecurityGroup statement below uses an ARN pattern. ---
        - PolicyName: security-group-lifecycle
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: Ec2CreateSecurityGroup
                Effect: Allow
                Action:
                  - ec2:CreateSecurityGroup
                Resource: '*'
              - Sid: Ec2DeleteSecurityGroup
                Effect: Allow
                Action:
                  - ec2:DeleteSecurityGroup
                Resource: !Sub 'arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:security-group/*'

  # --- action-execution-fn: dedicated mutating Lambda, invoked by RouterFunction through
  # lambda:InvokeFunction (NOT through a Function URL/API Gateway). Timeout 310s = buffer for up to
  # 300s of snapshot polling + overhead. ---
  ActionExecutionFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${Org}-${Project}-${Environment}-action-execution-fn'
      Runtime: nodejs22.x
      Architectures: [arm64]
      Handler: index.handler
      Timeout: 310
      MemorySize: 256
      Role: !GetAtt ActionExecutionRole.Arn
      Code: ./build/action-execution
      Environment:
        Variables:
          ENTRA_TENANT_ID: !Ref EntraTenantId
          ENTRA_CLIENT_ID: !Ref EntraClientId
          ALLOWED_GROUP_IDS: !Ref AllowedGroupIds
          ASSESSMENT_BUCKET_NAME: !Ref AssessmentReportBucket
          EC2_STATE_MANAGER_SERVICE_TOKEN_PARAM_NAME: !Ref Ec2StateManagerServiceTokenParamName
          EC2_STATE_MANAGER_FUNCTION_URL: !Ref Ec2StateManagerFunctionUrl
          ACTION_EXECUTION_FUNCTION_NAME: !Sub '${Org}-${Project}-${Environment}-action-execution-fn'
          AWS_ACCOUNT_ID: !Ref AWS::AccountId
          # SCHEDULED_ACTIONS_MUTATE_FUNCTION_NAME was MISSING, and `config.ts` is a singleton that
          # validates EVERY required variable at module load — so this Lambda would have thrown
          # "Missing required environment variable: SCHEDULED_ACTIONS_MUTATE_FUNCTION_NAME" on its very
          # first invocation, even though it never uses the value.
          #
          # It had not surfaced yet ONLY because OperatorGroupIds is currently empty: nobody holds
          # operator rights, so this function has never been invoked. Granting operator rights to one
          # person would have made every resource action fail immediately.
          #
          # Found by `lambda-boot.test.ts`, written after health-report-fn and time-of-day-trigger-fn
          # spent 10 and 7 days respectively dead from exactly this class of bug.
          SCHEDULED_ACTIONS_MUTATE_FUNCTION_NAME: !Ref ScheduledActionsMutateFunction
          # Same class of bug as the comment above (config.ts fails loud at module load for EVERY
          # required field, even ones this Lambda's own code never reads) — action-execution-fn
          # never calls approval-mutate-fn itself (that only happens from the router/
          # actions-execute-approval.ts), but importing config.ts still requires this to be set.
          APPROVAL_MUTATE_FUNCTION_NAME: !Ref ApprovalMutateFunction
          # Same class of bug again (config.ts's idleSchedulerMutateFunctionName field, added for
          # the Idle-to-Zero feature) — action-execution-fn never invokes idle-scheduler-mutate-fn
          # itself (only the router does, from POST /idle-scheduler), but importing config.ts
          # still requires this to be set. Caught by lambda-boot.test.ts before it could repeat a
          # 3rd time.
          IDLE_SCHEDULER_MUTATE_FUNCTION_NAME: !Ref IdleSchedulerMutateFunction
      Tags:
        - { Key: Environment, Value: !Ref Environment }
        - { Key: Project, Value: !Ref Project }
        - { Key: Lifecycle, Value: active }
        - { Key: Owner, Value: platform }

  ActionExecutionFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${ActionExecutionFunction}'
      RetentionInDays: 30

  ActionExecutionFunctionErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${Org}-${Project}-${Environment}-action-execution-fn-errors'
      AlarmDescription: 'ActionExecutionFunction Errors >= 1 in one cycle - check CloudWatch Logs.'
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref ActionExecutionFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmNotificationTopic
      OKActions:
        - !Ref AlarmNotificationTopic

  # ============================================================================================
  # Idle-to-Zero: tag-driven, first-class ops-dashboard feature that always applies idle-to-zero
  # and self-checks/restores itself if disabled. It discovers EVERY ALB tagged
  # `IdleScheduler:Managed=true` at runtime (see shared/src/idleScheduler.ts) instead of hardcoding
  # one EC2/RDS/ALB triple through CloudFormation Parameters. Enrolling a new non-production
  # environment needs zero code change/redeploy, only tagging its ALB via `POST /idle-scheduler`.
  #
  # 4 Lambdas:
  #   idle-scheduler-tick-fn      rate(5 minutes)  — stops EC2+RDS after N idle minutes (0 ALB
  #                               requests summed across every target group).
  #   idle-scheduler-wake-fn      SNS subscriber   — starts EC2+RDS in parallel on a managed
  #                               group's own wake alarm (ALB 5xx, no healthy target).
  #   idle-scheduler-watchdog-fn  rate(60 minutes) — re-asserts the mechanism cannot be silently
  #                               disabled (tick schedule state, both Lambdas' reserved
  #                               concurrency, each group's managed tag + wake alarm actions).
  #   idle-scheduler-mutate-fn    lambda:InvokeFunction from the router — the ONLY place with
  #                               elasticloadbalancing:AddTags/RemoveTags + cloudwatch:
  #                               PutMetricAlarm/DeleteAlarms for this feature (mutate-separation
  #                               pattern, same as ScheduledActionsMutateFunction/ApprovalMutateFunction).
  # ============================================================================================

  IdleSchedulerWakeTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub '${Org}-${Project}-${Environment}-idle-scheduler-wake'
      # SNS DisplayName is capped at 100 characters (AWS-documented limit) - kept short rather
      # than the fuller description this topic's own header comment already gives.
      DisplayName: 'ops-dashboard idle-to-zero wake trigger'
      Tags:
        - { Key: Environment, Value: !Ref Environment }
        - { Key: Project, Value: !Ref Project }
        - { Key: Lifecycle, Value: active }
        - { Key: Owner, Value: platform }

  # --- IAM: idle-scheduler-tick-fn (rate(5 minutes)). Read-only Describe* to discover managed
  # ALBs/target groups/EC2/RDS + cloudwatch:GetMetricStatistics for RequestCount, plus the 2
  # actual mutations (ec2:StopInstances/rds:StopDBInstance) scoped as tightly as each API allows. ---
  IdleSchedulerTickRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${Org}-${Project}-${Environment}-idle-scheduler-tick-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: idle-scheduler-tick-discover-and-stop
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: AlbDiscoveryReadOnly
                Effect: Allow
                Action:
                  - elasticloadbalancing:DescribeLoadBalancers
                  - elasticloadbalancing:DescribeTags
                  - elasticloadbalancing:DescribeTargetGroups
                Resource: '*'
              - Sid: MetricsReadOnly
                Effect: Allow
                Action: cloudwatch:GetMetricStatistics
                Resource: '*'
              # ec2:DescribeInstances does NOT support resource-level permissions (AWS-documented
              # limitation), so it must always be Resource: '*' with no Condition.
              - Sid: Ec2DescribeReadOnly
                Effect: Allow
                Action: ec2:DescribeInstances
                Resource: '*'
              # ec2:StopInstances DOES support the resource-tag condition, so least privilege is kept
              # here: only instances still carrying IdleScheduler:Managed=true can be stopped, even
              # though the instance id itself came from a tag this Lambda already trusts.
              # This literal MUST match shared/src/idleScheduler.ts's IDLE_SCHEDULER_MANAGED_TAG_KEY.
              # If you ever rename the tag key, redeploy this literal BEFORE re-tagging any ALB with
              # the new key, or this Lambda silently loses permission to stop any "managed" instance
              # (AccessDenied, not a crash, easy to miss until the next idle-stop tick is due).
              - Sid: Ec2StopOnlyManagedInstances
                Effect: Allow
                Action: ec2:StopInstances
                Resource: '*'
                Condition:
                  StringEquals: { 'ec2:ResourceTag/IdleScheduler:Managed': 'true' }
              - Sid: RdsDescribeAndStop
                Effect: Allow
                Action: [rds:DescribeDBInstances, rds:StopDBInstance]
                Resource: !Sub 'arn:${AWS::Partition}:rds:${AWS::Region}:${AWS::AccountId}:db:*'
        - PolicyName: idle-scheduler-tick-discord-webhook
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${DiscordWebhookUrlParamName}'
              - Effect: Allow
                Action: kms:Decrypt
                Resource: '*'
                Condition:
                  StringEquals:
                    kms:ViaService: !Sub 'ssm.${AWS::Region}.amazonaws.com'

  IdleSchedulerTickFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${Org}-${Project}-${Environment}-idle-scheduler-tick-fn'
      Description: >-
        Every 5 minutes, discovers every ALB tagged IdleScheduler:Managed=true and stops its
        EC2+RDS once idleMinutes have passed with zero ALB requests across every target group.
      Runtime: nodejs22.x
      Architectures: [arm64]
      Handler: index.handler
      Timeout: 90
      MemorySize: 256
      ReservedConcurrentExecutions: 1
      Role: !GetAtt IdleSchedulerTickRole.Arn
      Code: ./build/idle-scheduler-tick
      Environment:
        Variables:
          DISCORD_WEBHOOK_URL_PARAM_NAME: !Ref DiscordWebhookUrlParamName
      Tags:
        - { Key: Environment, Value: !Ref Environment }
        - { Key: Project, Value: !Ref Project }
        - { Key: Lifecycle, Value: active }
        - { Key: Owner, Value: platform }

  IdleSchedulerTickFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${IdleSchedulerTickFunction}'
      RetentionInDays: 30

  IdleSchedulerTickFunctionErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${Org}-${Project}-${Environment}-idle-scheduler-tick-fn-errors'
      AlarmDescription: 'IdleSchedulerTickFunction Errors >= 1 in one cycle - check CloudWatch Logs.'
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref IdleSchedulerTickFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmNotificationTopic
      OKActions:
        - !Ref AlarmNotificationTopic

  IdleSchedulerTickScheduleRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${Org}-${Project}-${Environment}-idle-sched-tick-sched-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: scheduler.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals: { 'aws:SourceAccount': !Ref AWS::AccountId }
      Policies:
        - PolicyName: invoke-idle-scheduler-tick
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt IdleSchedulerTickFunction.Arn
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt SchedulerDeadLetterQueue.Arn

  IdleSchedulerTickSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: !Sub '${Org}-${Project}-${Environment}-idle-scheduler-tick'
      Description: Every 5 minutes, checks every managed idle-to-zero resource-group and stops it once idle.
      FlexibleTimeWindow: { Mode: 'OFF' }
      ScheduleExpression: 'rate(5 minutes)'
      State: ENABLED
      Target:
        Arn: !GetAtt IdleSchedulerTickFunction.Arn
        RoleArn: !GetAtt IdleSchedulerTickScheduleRole.Arn
        RetryPolicy:
          MaximumRetryAttempts: 0
          MaximumEventAgeInSeconds: 300
        DeadLetterConfig:
          Arn: !GetAtt SchedulerDeadLetterQueue.Arn

  # --- IAM: idle-scheduler-wake-fn (SNS subscriber on IdleSchedulerWakeTopic). Mirrors
  # IdleSchedulerTickRole's read-only ALB discovery + adds ec2:StartInstances/rds:StartDBInstance
  # (the exact inverse of the tick Lambda's Stop actions). ---
  IdleSchedulerWakeRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${Org}-${Project}-${Environment}-idle-scheduler-wake-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: idle-scheduler-wake-discover-and-start
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: AlbDiscoveryReadOnly
                Effect: Allow
                Action:
                  - elasticloadbalancing:DescribeLoadBalancers
                  - elasticloadbalancing:DescribeTags
                Resource: '*'
              - Sid: Ec2DescribeReadOnly
                Effect: Allow
                Action: ec2:DescribeInstances
                Resource: '*'
              # Same literal-tag caveat as IdleSchedulerTickRole's Ec2StopOnlyManagedInstances Sid
              # above: it must match IDLE_SCHEDULER_MANAGED_TAG_KEY.
              - Sid: Ec2StartOnlyManagedInstances
                Effect: Allow
                Action: ec2:StartInstances
                Resource: '*'
                Condition:
                  StringEquals: { 'ec2:ResourceTag/IdleScheduler:Managed': 'true' }
              - Sid: RdsDescribeAndStart
                Effect: Allow
                Action: [rds:DescribeDBInstances, rds:StartDBInstance]
                Resource: !Sub 'arn:${AWS::Partition}:rds:${AWS::Region}:${AWS::AccountId}:db:*'
        - PolicyName: idle-scheduler-wake-discord-webhook
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${DiscordWebhookUrlParamName}'
              - Effect: Allow
                Action: kms:Decrypt
                Resource: '*'
                Condition:
                  StringEquals:
                    kms:ViaService: !Sub 'ssm.${AWS::Region}.amazonaws.com'

  IdleSchedulerWakeFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${Org}-${Project}-${Environment}-idle-scheduler-wake-fn'
      Description: >-
        Starts a managed resource-group's EC2+RDS in parallel as soon as its own wake alarm fires
        (ALB 5xx, no healthy target — a real request arrived while the group was idle-stopped).
      Runtime: nodejs22.x
      Architectures: [arm64]
      Handler: index.handler
      Timeout: 30
      MemorySize: 256
      Role: !GetAtt IdleSchedulerWakeRole.Arn
      Code: ./build/idle-scheduler-wake
      Environment:
        Variables:
          DISCORD_WEBHOOK_URL_PARAM_NAME: !Ref DiscordWebhookUrlParamName
      Tags:
        - { Key: Environment, Value: !Ref Environment }
        - { Key: Project, Value: !Ref Project }
        - { Key: Lifecycle, Value: active }
        - { Key: Owner, Value: platform }

  IdleSchedulerWakeFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${IdleSchedulerWakeFunction}'
      RetentionInDays: 30

  IdleSchedulerWakeFunctionErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${Org}-${Project}-${Environment}-idle-scheduler-wake-fn-errors'
      AlarmDescription: 'IdleSchedulerWakeFunction Errors >= 1 in one cycle - check CloudWatch Logs.'
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref IdleSchedulerWakeFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmNotificationTopic
      OKActions:
        - !Ref AlarmNotificationTopic

  IdleSchedulerWakeTopicSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref IdleSchedulerWakeTopic
      Protocol: lambda
      Endpoint: !GetAtt IdleSchedulerWakeFunction.Arn

  IdleSchedulerWakeTopicInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref IdleSchedulerWakeFunction
      Action: lambda:InvokeFunction
      Principal: sns.amazonaws.com
      SourceArn: !Ref IdleSchedulerWakeTopic

  # --- IAM: idle-scheduler-watchdog-fn (rate(60 minutes)). Re-asserts the mechanism's own config
  # cannot be silently disabled — see the file header comment in idle-scheduler-watchdog.ts for
  # exactly what is checked/corrected. Deliberately has NO ec2:Stop/StartInstances or
  # rds:Stop/StartDBInstance permission at all — it must never touch resource running state. ---
  IdleSchedulerWatchdogRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${Org}-${Project}-${Environment}-idle-sched-watchdog-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: idle-scheduler-watchdog-self-heal
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: AlbDiscoveryReadOnly
                Effect: Allow
                Action:
                  - elasticloadbalancing:DescribeLoadBalancers
                  - elasticloadbalancing:DescribeTags
                Resource: '*'
              - Sid: SchedulerGetAndUpdateTickSchedule
                Effect: Allow
                Action: [scheduler:GetSchedule, scheduler:UpdateSchedule]
                Resource: !Sub 'arn:${AWS::Partition}:scheduler:${AWS::Region}:${AWS::AccountId}:schedule/default/${Org}-${Project}-${Environment}-idle-scheduler-tick'
              - Sid: LambdaConcurrencyReadAndRestore
                Effect: Allow
                Action:
                  - lambda:GetFunctionConcurrency
                  - lambda:PutFunctionConcurrency
                Resource:
                  - !GetAtt IdleSchedulerTickFunction.Arn
                  - !GetAtt IdleSchedulerWakeFunction.Arn
              - Sid: AlarmReadAndEnableActionsOnly
                Effect: Allow
                # cloudwatch:SetAlarmState is deliberately NOT granted — this role may only flip
                # ActionsEnabled back on, never force an alarm's state directly.
                Action: [cloudwatch:DescribeAlarms, cloudwatch:EnableAlarmActions, cloudwatch:PutMetricData]
                Resource: '*'
        - PolicyName: idle-scheduler-watchdog-discord-webhook
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${DiscordWebhookUrlParamName}'
              - Effect: Allow
                Action: kms:Decrypt
                Resource: '*'
                Condition:
                  StringEquals:
                    kms:ViaService: !Sub 'ssm.${AWS::Region}.amazonaws.com'

  IdleSchedulerWatchdogFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${Org}-${Project}-${Environment}-idle-scheduler-watchdog-fn'
      Description: >-
        Every 60 minutes, re-asserts that idle-to-zero (tick schedule, both Lambdas' concurrency,
        every managed group's tag + wake alarm actions) is fully enabled — self-heals drift and
        alerts. Never touches EC2/RDS running/stopped state.
      Runtime: nodejs22.x
      Architectures: [arm64]
      Handler: index.handler
      Timeout: 60
      MemorySize: 256
      ReservedConcurrentExecutions: 1
      Role: !GetAtt IdleSchedulerWatchdogRole.Arn
      Code: ./build/idle-scheduler-watchdog
      Environment:
        Variables:
          DISCORD_WEBHOOK_URL_PARAM_NAME: !Ref DiscordWebhookUrlParamName
          IDLE_SCHEDULER_TICK_SCHEDULE_NAME: !Sub '${Org}-${Project}-${Environment}-idle-scheduler-tick'
          IDLE_SCHEDULER_SCHEDULE_GROUP: default
          IDLE_SCHEDULER_TICK_FUNCTION_NAME: !Ref IdleSchedulerTickFunction
          IDLE_SCHEDULER_WAKE_FUNCTION_NAME: !Ref IdleSchedulerWakeFunction
      Tags:
        - { Key: Environment, Value: !Ref Environment }
        - { Key: Project, Value: !Ref Project }
        - { Key: Lifecycle, Value: active }
        - { Key: Owner, Value: platform }

  IdleSchedulerWatchdogFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${IdleSchedulerWatchdogFunction}'
      RetentionInDays: 30

  IdleSchedulerWatchdogFunctionErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${Org}-${Project}-${Environment}-idle-scheduler-watchdog-fn-errors'
      AlarmDescription: 'IdleSchedulerWatchdogFunction Errors >= 1 in one cycle - check CloudWatch Logs.'
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref IdleSchedulerWatchdogFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmNotificationTopic
      OKActions:
        - !Ref AlarmNotificationTopic

  IdleSchedulerWatchdogScheduleRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${Org}-${Project}-${Environment}-idle-sched-watchdog-sched-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: scheduler.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals: { 'aws:SourceAccount': !Ref AWS::AccountId }
      Policies:
        - PolicyName: invoke-idle-scheduler-watchdog
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt IdleSchedulerWatchdogFunction.Arn
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt SchedulerDeadLetterQueue.Arn

  IdleSchedulerWatchdogSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: !Sub '${Org}-${Project}-${Environment}-idle-scheduler-watchdog'
      Description: Every 60 minutes, re-asserts the idle-to-zero mechanism cannot be silently disabled.
      FlexibleTimeWindow: { Mode: 'OFF' }
      ScheduleExpression: 'rate(60 minutes)'
      State: ENABLED
      Target:
        Arn: !GetAtt IdleSchedulerWatchdogFunction.Arn
        RoleArn: !GetAtt IdleSchedulerWatchdogScheduleRole.Arn
        RetryPolicy:
          MaximumRetryAttempts: 0
          MaximumEventAgeInSeconds: 300
        DeadLetterConfig:
          Arn: !GetAtt SchedulerDeadLetterQueue.Arn

  IdleSchedulerWatchdogDriftAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${Org}-${Project}-${Environment}-idle-scheduler-watchdog-drift'
      AlarmDescription: >-
        Fires when idle-scheduler-watchdog-fn finds (and auto-corrects) drift in the idle-to-zero
        mechanism's configuration - e.g. the tick schedule was disabled, a Lambda's reserved
        concurrency was zeroed, a managed group's tag/wake-alarm-actions was removed/disabled. The
        mechanism self-heals either way; this alarm exists so a PATTERN of someone repeatedly
        disabling it does not go unnoticed.
      Namespace: OpsDashboard/IdleScheduler
      MetricName: WatchdogDriftDetected
      Statistic: Maximum
      Period: 3600
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmNotificationTopic
      OKActions:
        - !Ref AlarmNotificationTopic

  # --- IAM: idle-scheduler-mutate-fn (invoked via lambda:InvokeFunction from the router).
  # Register = AddTags on the target ALB + PutMetricAlarm for its dedicated wake alarm.
  # Deregister = the exact inverse (RemoveTags + DeleteAlarms). ---
  IdleSchedulerMutateRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${Org}-${Project}-${Environment}-idle-scheduler-mutate-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: idle-scheduler-mutate-tags-and-alarm
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: AlbDescribeReadOnly
                Effect: Allow
                Action: elasticloadbalancing:DescribeLoadBalancers
                Resource: '*'
              # elasticloadbalancing:AddTags/RemoveTags DOES support resource-level permission for
              # the loadbalancer/app/* resource type — scoped accordingly rather than '*'.
              - Sid: AlbTagWriteScoped
                Effect: Allow
                Action: [elasticloadbalancing:AddTags, elasticloadbalancing:RemoveTags]
                Resource: !Sub 'arn:${AWS::Partition}:elasticloadbalancing:${AWS::Region}:${AWS::AccountId}:loadbalancer/app/*'
              - Sid: WakeAlarmReadWrite
                Effect: Allow
                Action: [cloudwatch:PutMetricAlarm, cloudwatch:DeleteAlarms]
                Resource: !Sub 'arn:${AWS::Partition}:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:idle-scheduler-wake-*'

  IdleSchedulerMutateFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${Org}-${Project}-${Environment}-idle-scheduler-mutate-fn'
      Runtime: nodejs22.x
      Architectures: [arm64]
      Handler: index.handler
      Timeout: 30
      MemorySize: 256
      Role: !GetAtt IdleSchedulerMutateRole.Arn
      Code: ./build/idle-scheduler-mutate
      Environment:
        Variables:
          IDLE_SCHEDULER_WAKE_TOPIC_ARN: !Ref IdleSchedulerWakeTopic
      Tags:
        - { Key: Environment, Value: !Ref Environment }
        - { Key: Project, Value: !Ref Project }
        - { Key: Lifecycle, Value: active }
        - { Key: Owner, Value: platform }

  IdleSchedulerMutateFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${IdleSchedulerMutateFunction}'
      RetentionInDays: 30

  IdleSchedulerMutateFunctionErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${Org}-${Project}-${Environment}-idle-scheduler-mutate-fn-errors'
      AlarmDescription: 'IdleSchedulerMutateFunction Errors >= 1 in one cycle - check CloudWatch Logs.'
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref IdleSchedulerMutateFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmNotificationTopic
      OKActions:
        - !Ref AlarmNotificationTopic

  # ============================================================================================
  # RDS Nightly Schedule: fixed midnight stop / morning start for RDS instances tagged
  # RdsNightlyScheduler:Managed=true. Meant for databases with sparse/bursty traffic, where
  # Idle-to-Zero traffic-based stop/wake would keep flapping the instance (see
  # rds-nightly-scheduler.ts's file header).
  # ONE Lambda, invoked by TWO Asia/Ho_Chi_Minh-timezone cron schedules with a different
  # Target.Input each (no per-environment redeploy needed, only tagging a new RDS instance).
  # NOTE: this Lambda never WRITES the tag itself; tag the RDS instances by hand (see
  # infra/tag-standard.md).
  # ============================================================================================
  RdsNightlySchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${Org}-${Project}-${Environment}-rds-nightly-sched-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: rds-nightly-scheduler-discover-and-toggle
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [rds:DescribeDBInstances, rds:ListTagsForResource, rds:StopDBInstance, rds:StartDBInstance]
                Resource: !Sub 'arn:${AWS::Partition}:rds:${AWS::Region}:${AWS::AccountId}:db:*'
        - PolicyName: rds-nightly-scheduler-discord-webhook
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${DiscordWebhookUrlParamName}'
              - Effect: Allow
                Action: kms:Decrypt
                Resource: '*'
                Condition:
                  StringEquals:
                    kms:ViaService: !Sub 'ssm.${AWS::Region}.amazonaws.com'

  RdsNightlySchedulerFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${Org}-${Project}-${Environment}-rds-nightly-scheduler-fn'
      Description: >-
        Stops/starts every RDS instance tagged RdsNightlyScheduler:Managed=true on a fixed
        Asia/Ho_Chi_Minh schedule (00:00 stop, 06:30 start), independent of ALB traffic.
      Runtime: nodejs22.x
      Architectures: [arm64]
      Handler: index.handler
      Timeout: 60
      MemorySize: 256
      ReservedConcurrentExecutions: 1
      Role: !GetAtt RdsNightlySchedulerRole.Arn
      Code: ./build/rds-nightly-scheduler
      Environment:
        Variables:
          DISCORD_WEBHOOK_URL_PARAM_NAME: !Ref DiscordWebhookUrlParamName
      Tags:
        - { Key: Environment, Value: !Ref Environment }
        - { Key: Project, Value: !Ref Project }
        - { Key: Lifecycle, Value: active }
        - { Key: Owner, Value: platform }

  RdsNightlySchedulerFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${RdsNightlySchedulerFunction}'
      RetentionInDays: 30

  RdsNightlySchedulerFunctionErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${Org}-${Project}-${Environment}-rds-nightly-scheduler-fn-errors'
      AlarmDescription: 'RdsNightlySchedulerFunction Errors >= 1 in one cycle - check CloudWatch Logs.'
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref RdsNightlySchedulerFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmNotificationTopic
      OKActions:
        - !Ref AlarmNotificationTopic

  RdsNightlySchedulerScheduleRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${Org}-${Project}-${Environment}-rds-nightly-sched-invoke-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: scheduler.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals: { 'aws:SourceAccount': !Ref AWS::AccountId }
      Policies:
        - PolicyName: invoke-rds-nightly-scheduler
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt RdsNightlySchedulerFunction.Arn
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt SchedulerDeadLetterQueue.Arn

  RdsNightlySchedulerStopSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: !Sub '${Org}-${Project}-${Environment}-rds-nightly-scheduler-stop'
      Description: Every night at 00:00 (Asia/Ho_Chi_Minh), stops every RDS instance tagged RdsNightlyScheduler:Managed=true.
      FlexibleTimeWindow: { Mode: 'OFF' }
      ScheduleExpression: 'cron(0 0 * * ? *)'
      ScheduleExpressionTimezone: 'Asia/Ho_Chi_Minh'
      State: ENABLED
      Target:
        Arn: !GetAtt RdsNightlySchedulerFunction.Arn
        RoleArn: !GetAtt RdsNightlySchedulerScheduleRole.Arn
        Input: '{"action":"stop"}'
        RetryPolicy:
          MaximumRetryAttempts: 1
          MaximumEventAgeInSeconds: 900
        DeadLetterConfig:
          Arn: !GetAtt SchedulerDeadLetterQueue.Arn

  RdsNightlySchedulerStartSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: !Sub '${Org}-${Project}-${Environment}-rds-nightly-scheduler-start'
      Description: Every morning at 06:30 (Asia/Ho_Chi_Minh), starts every RDS instance tagged RdsNightlyScheduler:Managed=true.
      FlexibleTimeWindow: { Mode: 'OFF' }
      ScheduleExpression: 'cron(30 6 * * ? *)'
      ScheduleExpressionTimezone: 'Asia/Ho_Chi_Minh'
      State: ENABLED
      Target:
        Arn: !GetAtt RdsNightlySchedulerFunction.Arn
        RoleArn: !GetAtt RdsNightlySchedulerScheduleRole.Arn
        Input: '{"action":"start"}'
        RetryPolicy:
          MaximumRetryAttempts: 1
          MaximumEventAgeInSeconds: 900
        DeadLetterConfig:
          Arn: !GetAtt SchedulerDeadLetterQueue.Arn

  RouterFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${Org}-${Project}-${Environment}-web-router-fn'
      Runtime: nodejs22.x
      Architectures: [arm64]
      Handler: index.handler
      Timeout: 15
      MemorySize: 256
      Role: !GetAtt RouterRole.Arn
      Code: ./build/router
      Environment:
        Variables:
          # The Origin header sent by browsers NEVER has a trailing "/" (only scheme://host[:port]),
          # while SiteUrl is the full Function URL (with a trailing "/"). It must be normalized to a
          # plain origin before it goes into the allowlist used for exact matching; otherwise CORS
          # always fails for real users.
          #
          # The CSV list = the origin of SiteUrl (frontend on the Lambda static-server) +
          # AdditionalAllowedOrigins (for example a frontend on Cloudflare Workers). No separate
          # Condition is needed for the empty case: readCsvEnv() in backend/src/config.ts already
          # trims and DROPS empty elements, so ',https://x' or 'https://x,' both yield exactly one
          # valid origin.
          ALLOWED_ORIGINS: !Join
            - ','
            - - !If
                - HasSiteUrl
                - !Join
                  - ''
                  - - !Select [0, !Split ['//', !Ref SiteUrl]]
                    - '//'
                    - !Select [0, !Split ['/', !Select [1, !Split ['//', !Ref SiteUrl]]]]
                - ''
              - !Ref AdditionalAllowedOrigins
          ENTRA_TENANT_ID: !Ref EntraTenantId
          ENTRA_CLIENT_ID: !Ref EntraClientId
          ALLOWED_GROUP_IDS: !Ref AllowedGroupIds
          OPERATOR_GROUP_IDS: !Ref OperatorGroupIds
          ASSESSMENT_BUCKET_NAME: !Ref AssessmentReportBucket
          ACTION_EXECUTION_FUNCTION_NAME: !Ref ActionExecutionFunction
          SCHEDULED_ACTIONS_MUTATE_FUNCTION_NAME: !Ref ScheduledActionsMutateFunction
          APPROVAL_MUTATE_FUNCTION_NAME: !Ref ApprovalMutateFunction
          IDLE_SCHEDULER_MUTATE_FUNCTION_NAME: !Ref IdleSchedulerMutateFunction
          # config.ts (backend/src/config.ts) is a singleton module that reads ALL required
          # environment variables as soon as it is loaded, EVEN when the running handler never uses
          # that field (router.ts does NOT call the state-manager service itself; only
          # action-execution-fn does). Without these 2 variables router-fn would crash at COLD START
          # for EVERY route, not only /actions/*. Same values as ActionExecutionFunction below (same
          # SSM parameter/URL).
          EC2_STATE_MANAGER_SERVICE_TOKEN_PARAM_NAME: !Ref Ec2StateManagerServiceTokenParamName
          EC2_STATE_MANAGER_FUNCTION_URL: !Ref Ec2StateManagerFunctionUrl
          AWS_ACCOUNT_ID: !Ref AWS::AccountId
      Tags:
        - { Key: Environment, Value: !Ref Environment }
        - { Key: Project, Value: !Ref Project }
        - { Key: Lifecycle, Value: active }
        - { Key: Owner, Value: platform }

  RouterFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
