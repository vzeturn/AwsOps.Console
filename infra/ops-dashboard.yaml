  # --- IAM: cost-collector (Cost Explorer read only + read/write 1 S3 object, cost-cache.json) ---
  CostCollectorRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${Org}-${Project}-${Environment}-collector-cost-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: cost-explorer-read-and-cache-write
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ce:GetCostAndUsage
                  - ce:GetCostForecast
                Resource: '*'
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource: !Sub '${AssessmentReportBucket.Arn}/cost-cache.json'
              # Cost threshold worsened -> proactive Discord notification (see
              # `shouldNotifyCostThresholdWorsened` in cost-collector.ts). Read-only, shares the
              # existing SSM Parameter of discord-alarm-notifier-fn (DiscordWebhookUrlParameter).
              - Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${DiscordWebhookUrlParamName}'
              # SecureString requires kms:Decrypt separately from ssm:GetParameter, scoped via
              # kms:ViaService (not a specific key Resource ARN - the AWS-managed `alias/aws/ssm`
              # key's real ARN is account-specific, same rationale as AiOpsAgentRole's
              # DecryptClaudeApiKeyViaSsmOnly statement) so this grant cannot decrypt anything
              # outside an SSM GetParameter call.
              - Effect: Allow
                Action: kms:Decrypt
                Resource: '*'
                Condition:
                  StringEquals:
                    kms:ViaService: !Sub 'ssm.${AWS::Region}.amazonaws.com'

  CostCollectorFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${Org}-${Project}-${Environment}-collector-cost-fn'
      Runtime: nodejs22.x
      Architectures: [arm64]
      Handler: index.handler
      Timeout: 30
      MemorySize: 256
      Role: !GetAtt CostCollectorRole.Arn
      Code: ./build/cost-collector
      Environment:
        Variables:
          ASSESSMENT_BUCKET_NAME: !Ref AssessmentReportBucket
          DISCORD_WEBHOOK_URL_PARAM_NAME: !Ref DiscordWebhookUrlParamName
          AWS_ACCOUNT_ID: !Ref AWS::AccountId
      Tags:
        - { Key: Environment, Value: !Ref Environment }
        - { Key: Project, Value: !Ref Project }
        - { Key: Lifecycle, Value: active }
        - { Key: Owner, Value: platform }

  CostCollectorFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${CostCollectorFunction}'
      RetentionInDays: 30

  CostCollectorFunctionErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${Org}-${Project}-${Environment}-collector-cost-fn-errors'
      AlarmDescription: 'CostCollectorFunction Errors >= 1 in one cycle - check CloudWatch Logs.'
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref CostCollectorFunction
      Statistic: Sum
      Period: 21600
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmNotificationTopic
      OKActions:
        - !Ref AlarmNotificationTopic

  # --- Data-freshness / "collector went silent" alarm: the Errors alarm above only fires when the
  # Lambda RAN and threw. It says nothing if the EventBridge Schedule itself stops triggering it (a
  # disabled/deleted schedule, an IAM trust break on CostCollectorScheduleRole, a Scheduler-side
  # outage), so the collector could silently stop producing a fresh cost-cache.json for days with
  # NO alarm ever firing. `Invocations` with `TreatMissingData: breaching` (the OPPOSITE of the
  # Errors alarm above) closes that gap: it alarms when the metric goes MISSING (zero invocations
  # in the period), not just when it crosses a numeric threshold. Period = 2x the schedule
  # interval (12h vs the 6h CostCollectorScheduleExpression default) to tolerate one late/skipped
  # run without false positives on ordinary jitter, while still catching a schedule that has
  # actually stopped.
  CostCollectorFunctionNoInvocationsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${Org}-${Project}-${Environment}-collector-cost-fn-no-invocations'
      AlarmDescription: 'CostCollectorFunction was not invoked in 12h - cost-cache.json may be stale, check the EventBridge Schedule (CostCollectorSchedule) and CostCollectorScheduleRole.'
      Namespace: AWS/Lambda
      MetricName: Invocations
      Dimensions:
        - Name: FunctionName
          Value: !Ref CostCollectorFunction
      Statistic: Sum
      Period: 43200
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions:
        - !Ref AlarmNotificationTopic
      OKActions:
        - !Ref AlarmNotificationTopic

  CostCollectorScheduleRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${Org}-${Project}-${Environment}-collector-cost-scheduler-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: scheduler.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals: { aws:SourceAccount: !Ref AWS::AccountId }
      Policies:
        - PolicyName: invoke-cost-collector-lambda
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt CostCollectorFunction.Arn
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt SchedulerDeadLetterQueue.Arn

  CostCollectorSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: !Sub '${Org}-${Project}-${Environment}-collector-cost'
      Description: Call Cost Explorer and refresh the cost cache every few hours (see CostCollectorScheduleExpression).
      FlexibleTimeWindow: { Mode: 'OFF' }
      ScheduleExpression: !Ref CostCollectorScheduleExpression
      State: ENABLED
      Target:
        Arn: !GetAtt CostCollectorFunction.Arn
        RoleArn: !GetAtt CostCollectorScheduleRole.Arn
        RetryPolicy:
          MaximumRetryAttempts: 2
          MaximumEventAgeInSeconds: 3600
        DeadLetterConfig:
          Arn: !GetAtt SchedulerDeadLetterQueue.Arn

  # --- IAM: infra-collector (read-only Describe on EC2/RDS/ELB + Backup/DLM/Config, writes 2 S3
  # objects, infra-cache.json/compliance-cache.json, so the router NEVER calls these APIs directly
  # on the request path) ---
  InfraCollectorRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${Org}-${Project}-${Environment}-collector-infra-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: infra-collector-read-and-cache-write
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ec2:DescribeInstances
                  - rds:DescribeDBInstances
                  - elasticloadbalancing:DescribeLoadBalancers
                  - elasticloadbalancing:DescribeTargetGroups
                  - elasticloadbalancing:DescribeTargetHealth
                  # DescribeTags: reads ALB tags to apply OpsDashboard:MonitoringExempt (see
                  # lib/thresholds.ts, applyMonitoringExemption). This lets an ALB whose targets are
                  # unhealthy by design (for example because idle-to-zero deliberately stopped the app
                  # instances, not a real incident) be excluded from the critical state on the Infra
                  # Map/Infra tab WITHOUT affecting CloudWatch Alarms/GuardDuty. Read-only; load
                  # balancers/target groups do not support resource-level ARNs (like the other
                  # Describe* above).
                  - elasticloadbalancing:DescribeTags
                Resource: '*'
              # --- Topology (Infra Map, see collectors/topology-collector.ts): network structure used
              # to draw the infrastructure map. ALL of these APIs are FREE (unlike the billed
              # cloudwatch:GetMetricData), so calling them on a 5-minute schedule does not raise the
              # bill. ecs:* is needed to find the subnets of awsvpc services. Every ec2:Describe* lacks
              # resource-level ARN support, so Resource:'*' is required (like ec2:DescribeInstances
              # above). ---
              - Effect: Allow
                Action:
                  - ec2:DescribeVpcs
                  - ec2:DescribeSubnets
                  # DescribeRouteTables DECIDES whether a subnet is really public (has a default
                  # route to an internet gateway), instead of guessing from the subnet name, which is
                  # set by people and is often wrong.
                  - ec2:DescribeRouteTables
                  - ec2:DescribeNatGateways
                  # Transit Gateway: DRAW ONLY, nothing is created/changed/deleted. Lists the existing
                  # TGWs and their REAL attachments to VPCs (DescribeTransitGatewayVpcAttachments) so
                  # the map shows exactly the VPCs this TGW really connects, with no guessing. See
                  # collectors/topology-collector.ts::loadTransitGatewayPlacement/
                  # loadTransitGatewayEdges.
                  - ec2:DescribeTransitGateways
                  - ec2:DescribeTransitGatewayVpcAttachments
                  - ecs:ListClusters
                  - ecs:ListServices
                  - ecs:DescribeServices
                Resource: '*'
              - Effect: Allow
                Action:
                  - backup:ListBackupJobs
                  - dlm:GetLifecyclePolicies
                  - config:DescribeComplianceByConfigRule
                Resource: '*'
              # s3:ListAllMyBuckets: DRAW ONLY, does not read bucket contents. Shows buckets that
              # ALREADY EXIST on the Infra Map as account-level resources (it does NOT create buckets
              # and does NOT GetObject/PutObject on any customer bucket). This API does not support
              # resource-level ARNs so Resource:'*' is required; it is kept separate from the 2
              # ARN-scoped s3:PutObject statements (infra-cache.json/...) right below to avoid
              # confusion about permission scope.
              - Effect: Allow
                Action: s3:ListAllMyBuckets
                Resource: '*'
              - Effect: Allow
                Action: s3:PutObject
                Resource:
                  - !Sub '${AssessmentReportBucket.Arn}/infra-cache.json'
                  - !Sub '${AssessmentReportBucket.Arn}/compliance-cache.json'
                  - !Sub '${AssessmentReportBucket.Arn}/topology-cache.json'

  InfraCollectorFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${Org}-${Project}-${Environment}-collector-infra-fn'
      Runtime: nodejs22.x
      Architectures: [arm64]
      Handler: index.handler
      Timeout: 60
      MemorySize: 256
      Role: !GetAtt InfraCollectorRole.Arn
      Code: ./build/infra-collector
      Environment:
        Variables:
          ASSESSMENT_BUCKET_NAME: !Ref AssessmentReportBucket
          AWS_ACCOUNT_ID: !Ref AWS::AccountId
      Tags:
        - { Key: Environment, Value: !Ref Environment }
        - { Key: Project, Value: !Ref Project }
        - { Key: Lifecycle, Value: active }
        - { Key: Owner, Value: platform }

  InfraCollectorFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${InfraCollectorFunction}'
      RetentionInDays: 30

  InfraCollectorFunctionErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${Org}-${Project}-${Environment}-collector-infra-fn-errors'
      AlarmDescription: 'InfraCollectorFunction Errors >= 1 in one cycle - check CloudWatch Logs.'
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref InfraCollectorFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmNotificationTopic
      OKActions:
        - !Ref AlarmNotificationTopic

  InfraCollectorScheduleRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${Org}-${Project}-${Environment}-collector-infra-scheduler-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: scheduler.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals: { aws:SourceAccount: !Ref AWS::AccountId }
      Policies:
        - PolicyName: invoke-infra-collector-lambda
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt InfraCollectorFunction.Arn
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt SchedulerDeadLetterQueue.Arn

  InfraCollectorSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: !Sub '${Org}-${Project}-${Environment}-collector-infra'
      Description: Refresh infra-cache.json/compliance-cache.json every few minutes (see InfraCollectorScheduleExpression).
      FlexibleTimeWindow: { Mode: 'OFF' }
      ScheduleExpression: !Ref InfraCollectorScheduleExpression
      State: ENABLED
      Target:
        Arn: !GetAtt InfraCollectorFunction.Arn
        RoleArn: !GetAtt InfraCollectorScheduleRole.Arn
        RetryPolicy:
          MaximumRetryAttempts: 2
          MaximumEventAgeInSeconds: 3600
        DeadLetterConfig:
          Arn: !GetAtt SchedulerDeadLetterQueue.Arn

  # --- IAM: infra-review-collector (read-only Describe/List on many services + billed
  # CloudWatch/Cost Explorer calls; only this Lambda and cost-collector may call the billed APIs,
  # and it writes exactly 1 S3 object, assessment-report.json) ---
  InfraReviewCollectorRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${Org}-${Project}-${Environment}-collector-compliance-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: infra-review-read-only-describe-list
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ec2:DescribeInstances
                  # assessment-report-builder.ts calls fetchFamilySizes() (the Time-of-Day Sizing
                  # loop, see lib/ec2Rightsizing.ts), which needs ec2:DescribeInstanceTypes to compute
                  # peakType/offPeakType. Without it every schedule computation fails with
                  # AccessDenied, which a per-instance try/catch swallows silently (log only, no
                  # throw), making the feature a silent no-op. AWS has no resource-level permission
                  # for this action (it applies to an instance TYPE, not a specific instance), so
                  # Resource: '*' is used, as in Ec2RightsizeApplierRole/TimeOfDayTriggerRole.
                  - ec2:DescribeInstanceTypes
                  - ec2:DescribeVolumes
                  - ec2:DescribeNatGateways
                  - rds:DescribeDBInstances
                  - elasticloadbalancing:DescribeLoadBalancers
                  - elasticloadbalancing:DescribeTargetGroups
                  - elasticloadbalancing:DescribeTargetHealth
                  - s3:ListAllMyBuckets
                  # The correct IAM ACTION name is "s3:GetLifecycleConfiguration" (no "Bucket"), see the
                  # full comment on ActionExecutionRole/RouterRole ("S3LifecycleReadOnlyForPreview").
                  # Using the wrong name causes AccessDenied in storage-collector.ts for EVERY bucket,
                  # so the assessment report wrongly says "hasLifecyclePolicy: false" even for buckets
                  # that do have a lifecycle policy.
                  - s3:GetLifecycleConfiguration
                  - lambda:ListFunctions
                  - backup:ListBackupPlans
                  - backup:ListBackupJobs
                  - backup:ListBackupSelections
                  - backup:GetBackupSelection
                  - backup:ListBackupVaults
                  - backup:GetBackupVaultAccessPolicy
                  - backup:ListRestoreTestingPlans
                  - dlm:GetLifecyclePolicies
                  - dlm:GetLifecyclePolicy
                Resource: '*'
              - Effect: Allow
                Action:
                  - cloudwatch:GetMetricData
                  - ce:GetSavingsPlansCoverage
                  - ce:GetReservationCoverage
                Resource: '*'
              # --- 2 read-only permissions for the 2 cost-optimization collectors (findingType
              # cloudWatchLogGroupNoRetention/elasticIpUnused, see infra-review-collector.ts):
              # logs:DescribeLogGroups (reads retention/storedBytes) + ec2:DescribeAddresses (reads
              # the AssociationId of an Elastic IP). Both are plain Describe/List, no mutation. ---
              - Effect: Allow
                Action:
                  - logs:DescribeLogGroups
                  - ec2:DescribeAddresses
                Resource: '*'
              # --- Read-only permissions for compute-optimizer-collector.ts (the official rightsizing
              # source, replacing a home-grown median-CPU heuristic; see findingType
              # ec2Underprovisioned/rdsUnderprovisioned). All 3 actions are plain Get*, do not mutate
              # and have no separate charge (Compute Optimizer is free). AWS has no resource-level
              # permission for these 3 actions, so Resource: '*' is used, like the other Describe/List
              # permissions in this policy. ---
              - Effect: Allow
                Action:
                  - compute-optimizer:GetEnrollmentStatus
                  - compute-optimizer:GetEC2InstanceRecommendations
                  - compute-optimizer:GetRDSDatabaseRecommendations
                Resource: '*'
              - Effect: Allow
                Action: s3:PutObject
                Resource:
                  - !Sub '${AssessmentReportBucket.Arn}/assessment-report.json'
                  # assessment-report-builder.ts (running in this InfraReviewCollectorFunction) writes
                  # the new schedule through s3PolicyStore.putComputedSchedule, see
                  # backend/src/modules/governance/s3PolicyStore.ts.
                  - !Sub '${AssessmentReportBucket.Arn}/timeofday-schedule/*'
              # Reads the report of the PREVIOUS run to diff and find NEW high-priority findings (see
              # `readPreviousRecommendations` in infra-review-collector.ts), for proactive Discord
              # notification. Same object as the PutObject above, only a different action.
              #
              # This role also re-reads the previous schedule through s3PolicyStore.getComputedSchedule:
              # assessment-report-builder.ts anchors the peakType/offPeakType baseline on the offPeakType
              # of the previously computed schedule (instead of the current instanceType, which may
              # already be resized up to peakType when this job runs), to avoid an unbounded upward
              # ratchet over many days.
              - Effect: Allow
                Action: s3:GetObject
                Resource:
                  - !Sub '${AssessmentReportBucket.Arn}/assessment-report.json'
                  - !Sub '${AssessmentReportBucket.Arn}/timeofday-schedule/*'
              # NEW high-priority finding -> proactive Discord notification. Read-only, shares the
              # existing SSM Parameter of discord-alarm-notifier-fn (DiscordWebhookUrlParameter).
              - Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${DiscordWebhookUrlParamName}'
              # SecureString requires kms:Decrypt separately from ssm:GetParameter, scoped via
              # kms:ViaService (not a specific key Resource ARN - the AWS-managed `alias/aws/ssm`
              # key's real ARN is account-specific, same rationale as AiOpsAgentRole's
              # DecryptClaudeApiKeyViaSsmOnly statement) so this grant cannot decrypt anything
              # outside an SSM GetParameter call.
              - Effect: Allow
                Action: kms:Decrypt
                Resource: '*'
                Condition:
                  StringEquals:
                    kms:ViaService: !Sub 'ssm.${AWS::Region}.amazonaws.com'
              # --- EC2_AutoRightsize (evaluator, see lib/ec2AutoRightsizing.ts): ONLY ec2:CreateTags/
              # DeleteTags SCOPED by a TagKeys condition to the single tag "OpsDashboard:PendingAuto-
              # Rightsize"; it cannot modify any other tag of the instance (defense in depth, the same
              # scoped-TagKeys principle used for PatchSchedulerRole/LastPatchCommandId).
              # The sub-key suffix is a LITERAL string, NOT derived from a code constant
              # (PendingAutoRightsize). ---
              - Effect: Allow
                Action: [ec2:CreateTags, ec2:DeleteTags]
                Resource: !Sub 'arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:instance/*'
                Condition:
                  ForAllValues:StringEquals:
                    aws:TagKeys: [!Sub '${TagPrefix}:PendingAutoRightsize']

  InfraReviewCollectorFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${Org}-${Project}-${Environment}-collector-compliance-fn'
      Runtime: nodejs22.x
      Architectures: [arm64]
      Handler: index.handler
      Timeout: 30
      MemorySize: 256
      Role: !GetAtt InfraReviewCollectorRole.Arn
      Code: ./build/infra-review-collector
      Environment:
        Variables:
          ASSESSMENT_BUCKET_NAME: !Ref AssessmentReportBucket
          DISCORD_WEBHOOK_URL_PARAM_NAME: !Ref DiscordWebhookUrlParamName
          AWS_ACCOUNT_ID: !Ref AWS::AccountId
          # See the comment on PatchSchedulerFunction about the required consistency across Lambdas.
          TAG_PREFIX: !Ref TagPrefix
          SCHEDULE_TAG_KEY: !Ref ScheduleTagKey
          PATCH_TIMEZONE: !Ref PatchTimezone
      Tags:
        - { Key: Environment, Value: !Ref Environment }
        - { Key: Project, Value: !Ref Project }
        - { Key: Lifecycle, Value: active }
        - { Key: Owner, Value: platform }

  InfraReviewCollectorFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${InfraReviewCollectorFunction}'
      RetentionInDays: 30

  InfraReviewCollectorFunctionErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${Org}-${Project}-${Environment}-collector-compliance-fn-errors'
      AlarmDescription: 'InfraReviewCollectorFunction Errors >= 1 in one cycle - check CloudWatch Logs.'
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref InfraReviewCollectorFunction
      Statistic: Sum
      Period: 86400
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmNotificationTopic
      OKActions:
        - !Ref AlarmNotificationTopic

  # --- Data-freshness / "collector went silent" alarm: same rationale as
  # CostCollectorFunctionNoInvocationsAlarm above. Errors alone says nothing if the schedule
  # itself stops firing. Period = 2 days (2x the InfraReviewScheduleExpression default of
  # rate(1 day)); assessment-report.json (the Assessment tab's ENTIRE data source) would otherwise
  # go stale with no alarm for an unbounded amount of time.
  InfraReviewCollectorFunctionNoInvocationsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${Org}-${Project}-${Environment}-collector-compliance-fn-no-invocations'
      AlarmDescription: 'InfraReviewCollectorFunction was not invoked in 2 days - assessment-report.json may be stale, check the EventBridge Schedule (InfraReviewSchedule) and InfraReviewCollectorScheduleRole.'
      Namespace: AWS/Lambda
      MetricName: Invocations
      Dimensions:
        - Name: FunctionName
          Value: !Ref InfraReviewCollectorFunction
      Statistic: Sum
      Period: 172800
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions:
        - !Ref AlarmNotificationTopic
      OKActions:
        - !Ref AlarmNotificationTopic

  InfraReviewCollectorScheduleRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${Org}-${Project}-${Environment}-collector-compliance-scheduler-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: scheduler.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals: { aws:SourceAccount: !Ref AWS::AccountId }
      Policies:
        - PolicyName: invoke-infra-review-collector-lambda
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt InfraReviewCollectorFunction.Arn
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt SchedulerDeadLetterQueue.Arn

  InfraReviewCollectorSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: !Sub '${Org}-${Project}-${Environment}-collector-compliance'
      Description: Survey the infrastructure, call CloudWatch/Cost Explorer and write assessment-report.json to S3 (see InfraReviewScheduleExpression).
      FlexibleTimeWindow: { Mode: 'OFF' }
      ScheduleExpression: !Ref InfraReviewScheduleExpression
      State: ENABLED
      Target:
        Arn: !GetAtt InfraReviewCollectorFunction.Arn
        RoleArn: !GetAtt InfraReviewCollectorScheduleRole.Arn
        RetryPolicy:
          MaximumRetryAttempts: 2
          MaximumEventAgeInSeconds: 3600
        DeadLetterConfig:
          Arn: !GetAtt SchedulerDeadLetterQueue.Arn

  # ================================================================================================
  # 5 self-healing automation Lambdas (see RUNBOOK.md section 5 for the rationale). Each turns a
  # one-time manual finding/fix into a recurring, automatic check, posting through the SAME
  # AlarmNotificationTopic -> alerting-notifier-fn -> Discord path every other alarm in this stack
  # already uses, so no new notification channel is added.

  # --- IAM: alerting-topic-guardian-fn (rate(1 day): every SNS topic used for alerting must have
  # >=1 subscriber, otherwise it is a silent alerting gap, see the alerting-topic-guardian.ts file
  # header). sns:ListTopics/ListSubscriptionsByTopic are read-only and account-wide (SNS does not
  # support resource-level ARN scoping for List* actions), covering topics OUTSIDE this stack too
  # (for example a security-alerts topic owned by Security Hub/Config). This is deliberate: a
  # silent topic is a gap regardless of which stack owns it. ---
  AlertingTopicGuardianRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${Org}-${Project}-${Environment}-alerting-topic-guardian-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: topic-guardian-read-only
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [sns:ListTopics, sns:ListSubscriptionsByTopic]
                Resource: '*'
        - PolicyName: topic-guardian-discord-webhook
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${DiscordWebhookUrlParamName}'
              - Effect: Allow
                Action: kms:Decrypt
                Resource: '*'
                Condition:
                  StringEquals:
                    kms:ViaService: !Sub 'ssm.${AWS::Region}.amazonaws.com'

  AlertingTopicGuardianFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${Org}-${Project}-${Environment}-alerting-topic-guardian-fn'
      Runtime: nodejs22.x
      Architectures: [arm64]
      Handler: index.handler
      Timeout: 60
      MemorySize: 256
      Role: !GetAtt AlertingTopicGuardianRole.Arn
      Code: ./build/alerting-topic-guardian
      Environment:
        Variables:
          DISCORD_WEBHOOK_URL_PARAM_NAME: !Ref DiscordWebhookUrlParamName
      Tags:
        - { Key: Environment, Value: !Ref Environment }
        - { Key: Project, Value: !Ref Project }
        - { Key: Lifecycle, Value: active }
        - { Key: Owner, Value: platform }

  AlertingTopicGuardianFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AlertingTopicGuardianFunction}'
      RetentionInDays: 30

  AlertingTopicGuardianFunctionErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${Org}-${Project}-${Environment}-alerting-topic-guardian-fn-errors'
      AlarmDescription: 'AlertingTopicGuardianFunction Errors >= 1 - check CloudWatch Logs.'
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref AlertingTopicGuardianFunction
      Statistic: Sum
      Period: 86400
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmNotificationTopic
      OKActions:
        - !Ref AlarmNotificationTopic

  AlertingTopicGuardianScheduleRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${Org}-${Project}-${Environment}-alerting-topic-guardian-scheduler-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: scheduler.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals: { aws:SourceAccount: !Ref AWS::AccountId }
      Policies:
        - PolicyName: invoke-alerting-topic-guardian-lambda
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt AlertingTopicGuardianFunction.Arn
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt SchedulerDeadLetterQueue.Arn

  AlertingTopicGuardianSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: !Sub '${Org}-${Project}-${Environment}-alerting-topic-guardian'
      Description: Check that every SNS topic has at least 1 subscriber, to detect topics that are "configured but nobody receives them".
      FlexibleTimeWindow: { Mode: 'OFF' }
      ScheduleExpression: 'rate(1 day)'
      State: ENABLED
      Target:
        Arn: !GetAtt AlertingTopicGuardianFunction.Arn
        RoleArn: !GetAtt AlertingTopicGuardianScheduleRole.Arn
        RetryPolicy:
          MaximumRetryAttempts: 2
          MaximumEventAgeInSeconds: 3600
        DeadLetterConfig:
          Arn: !GetAtt SchedulerDeadLetterQueue.Arn

  # --- IAM: security-guardduty-triage-fn (2nd target on GuardDutyFindingsRule - auto-archives a
  # finding when the affected EC2 instance already carries a SecurityException tag). Needs
  # ec2:DescribeTags (read the exception tag), guardduty:ListDetectors + guardduty:ArchiveFindings
  # (the only mutating action this Lambda performs, and only on a finding whose resource already
  # has an explicit exception - see security-guardduty-triage.ts file header for why tag-based,
  # not a hardcoded finding-type/instance-id filter). ---
  SecurityGuardDutyTriageRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${Org}-${Project}-${Environment}-security-guardduty-triage-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: guardduty-triage-read-tags-and-archive
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ec2:DescribeTags
                Resource: '*'
              - Effect: Allow
                Action: [guardduty:ListDetectors, guardduty:ArchiveFindings]
                Resource: '*'
        - PolicyName: guardduty-triage-discord-webhook
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${DiscordWebhookUrlParamName}'
              - Effect: Allow
                Action: kms:Decrypt
                Resource: '*'
                Condition:
                  StringEquals:
                    kms:ViaService: !Sub 'ssm.${AWS::Region}.amazonaws.com'

  SecurityGuardDutyTriageFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${Org}-${Project}-${Environment}-security-guardduty-triage-fn'
      Runtime: nodejs22.x
      Architectures: [arm64]
      Handler: index.handler
      Timeout: 30
      MemorySize: 256
      Role: !GetAtt SecurityGuardDutyTriageRole.Arn
      Code: ./build/security-guardduty-triage
      Environment:
        Variables:
          DISCORD_WEBHOOK_URL_PARAM_NAME: !Ref DiscordWebhookUrlParamName
      Tags:
        - { Key: Environment, Value: !Ref Environment }
        - { Key: Project, Value: !Ref Project }
        - { Key: Lifecycle, Value: active }
        - { Key: Owner, Value: platform }

  SecurityGuardDutyTriageFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${SecurityGuardDutyTriageFunction}'
      RetentionInDays: 30

  SecurityGuardDutyTriageFunctionErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${Org}-${Project}-${Environment}-security-guardduty-triage-fn-errors'
      AlarmDescription: 'SecurityGuardDutyTriageFunction Errors >= 1 - check CloudWatch Logs.'
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref SecurityGuardDutyTriageFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmNotificationTopic
      OKActions:
        - !Ref AlarmNotificationTopic

  # Second target on the SAME rule that already forwards to AlarmNotificationTopic — findings still
  # reach Discord via the existing target regardless of what this Lambda decides; this is a parallel
  # observer, not a replacement for that forwarding path.
  GuardDutyFindingsRuleTriageTarget:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub '${Org}-${Project}-${Environment}-guardduty-findings-triage'
      Description: Second target on the GuardDuty findings pattern - invokes security-guardduty-triage-fn to auto-archive findings on resources with an existing SecurityException tag.
      EventPattern:
        source: [aws.guardduty]
        'detail-type': ['GuardDuty Finding']
        detail:
          severity:
            - numeric: ['>=', 4]
      State: ENABLED
      Targets:
        - Arn: !GetAtt SecurityGuardDutyTriageFunction.Arn
          Id: guardduty-findings-to-triage-fn

  SecurityGuardDutyTriageEventBridgePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref SecurityGuardDutyTriageFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt GuardDutyFindingsRuleTriageTarget.Arn

