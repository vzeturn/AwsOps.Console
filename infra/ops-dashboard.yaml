        - { Key: Project, Value: !Ref Project }
        - { Key: Lifecycle, Value: active }
        - { Key: Owner, Value: platform }

  SecurityEndpointDriftDetectorFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${SecurityEndpointDriftDetectorFunction}'
      RetentionInDays: 30

  SecurityEndpointDriftDetectorFunctionErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${Org}-${Project}-${Environment}-security-endpoint-drift-detector-fn-errors'
      AlarmDescription: 'SecurityEndpointDriftDetectorFunction Errors >= 1 - check CloudWatch Logs.'
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref SecurityEndpointDriftDetectorFunction
      Statistic: Sum
      Period: 86400
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmNotificationTopic
      OKActions:
        - !Ref AlarmNotificationTopic

  SecurityEndpointDriftDetectorScheduleRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${Org}-${Project}-${Environment}-security-endpoint-drift-scheduler-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: scheduler.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals: { aws:SourceAccount: !Ref AWS::AccountId }
      Policies:
        - PolicyName: invoke-security-endpoint-drift-detector-lambda
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt SecurityEndpointDriftDetectorFunction.Arn
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt SchedulerDeadLetterQueue.Arn

  SecurityEndpointDriftDetectorSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: !Sub '${Org}-${Project}-${Environment}-security-endpoint-drift-detector'
      Description: Scan for VPN/tunnel processes (tailscaled/netbird/cloudflared) on every SSM-managed instance and alert if there is no SecurityException tag.
      FlexibleTimeWindow: { Mode: 'OFF' }
      ScheduleExpression: 'rate(1 day)'
      State: ENABLED
      Target:
        Arn: !GetAtt SecurityEndpointDriftDetectorFunction.Arn
        RoleArn: !GetAtt SecurityEndpointDriftDetectorScheduleRole.Arn
        RetryPolicy:
          MaximumRetryAttempts: 2
          MaximumEventAgeInSeconds: 3600
        DeadLetterConfig:
          Arn: !GetAtt SchedulerDeadLetterQueue.Arn

Outputs:
  RouterFunctionUrl:
    Description: >-
      The router Lambda's Function URL - the API base URL the frontend calls (config.js
      apiBaseUrl). Read by infra/deploy-frontend-cloudflare.sh at build time so it is never
      hardcoded, and referenced by RUNBOOK.md/README.md for the ADDITIONAL_ALLOWED_ORIGINS
      redeploy step when adding a second frontend origin.
    Value: !GetAtt RouterFunctionUrl.FunctionUrl
  StaticServerFunctionUrl:
    Description: >-
      The static-server Lambda's Function URL - serves the React SPA (Lambda-hosted frontend,
      currently running in parallel with the Cloudflare Workers deployment; see README.md
      "Frontend on Cloudflare Workers"). Also the fallback/rollback target if the Cloudflare
      deployment needs to be backed out.
    Value: !GetAtt StaticServerFunctionUrl.FunctionUrl
  AssessmentReportBucketName:
    Description: >-
      S3 bucket holding every cache/report this stack writes on a schedule
      (infra/compliance/monitoring/topology/cost caches, assessment-report.json, action-audit/
      records). DeletionPolicy: Retain - deleting the stack does not delete this bucket or its
      history.
    Value: !Ref AssessmentReportBucket
  IdleSchedulerTickFunctionArn:
    Description: Idle-to-Zero tick Lambda (rate(5 minutes)) - stops managed EC2+RDS resource-groups once idle.
    Value: !GetAtt IdleSchedulerTickFunction.Arn
  IdleSchedulerWakeFunctionArn:
    Description: Idle-to-Zero wake Lambda (SNS subscriber) - starts managed EC2+RDS resource-groups on their own wake alarm.
    Value: !GetAtt IdleSchedulerWakeFunction.Arn
  IdleSchedulerWatchdogFunctionArn:
    Description: Idle-to-Zero watchdog Lambda (rate(60 minutes)) - re-asserts the mechanism cannot be silently disabled.
    Value: !GetAtt IdleSchedulerWatchdogFunction.Arn
  IdleSchedulerWakeTopicArn:
    Description: SNS topic every managed resource-group's dedicated wake alarm points its AlarmActions at.
    Value: !Ref IdleSchedulerWakeTopic
