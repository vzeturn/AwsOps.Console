  SecurityPublicBucketGuardianScheduleRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${Org}-${Project}-${Environment}-security-public-bucket-scheduler-role'
      AssumeRolePolicyDocument:
