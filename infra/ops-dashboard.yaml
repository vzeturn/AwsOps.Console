  # --- IAM: health-report-fn (posts a Discord embed summarizing system health every 15 minutes,
  # independent of the SNS path). Needs only cloudwatch:DescribeAlarms (reads existing alarm state;
  # NO Put/DeleteAlarms, unlike AlarmBaselineManagerRole, because this Lambda does not manage
  # alarms), ssm:GetParameter on DiscordWebhookUrlParameter (posts to Discord through
  # discordWebhook.ts, same parameter as discord-alarm-notifier-fn/alarm-baseline-manager-fn) and
  # ec2:DescribeInstances (looks up the Name tag of EC2 instances behind alarms, same reason and
  # permission as DiscordAlarmNotifierRole above, so the same InstanceId shows the same name in
  # both notification channels). ---
  HealthReportRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${Org}-${Project}-${Environment}-alerting-health-report-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: health-report-read-alarms
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: cloudwatch:DescribeAlarms
                Resource: '*'
        - PolicyName: health-report-discord-webhook
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${DiscordWebhookUrlParamName}'
              # SecureString requires kms:Decrypt separately from ssm:GetParameter, scoped via
              # kms:ViaService (not a specific key Resource ARN - the AWS-managed `alias/aws/ssm`
              # key's real ARN is account-specific, same rationale as AiOpsAgentRole's
              # DecryptClaudeApiKeyViaSsmOnly statement) so this grant cannot decrypt anything
              # outside an SSM GetParameter call.
              - Effect: Allow
                Action: kms:Decrypt
                Resource: '*'
                Condition:
                  StringEquals:
                    kms:ViaService: !Sub 'ssm.${AWS::Region}.amazonaws.com'
        - PolicyName: health-report-ec2-name-lookup
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ec2:DescribeInstances
                Resource: '*'

  HealthReportFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${Org}-${Project}-${Environment}-alerting-health-report-fn'
      Runtime: nodejs22.x
      Architectures: [arm64]
      Handler: index.handler
      Timeout: 30
      MemorySize: 256
      Role: !GetAtt HealthReportRole.Arn
      Code: ./build/health-report
      Environment:
        Variables:
          DISCORD_WEBHOOK_URL_PARAM_NAME: !Ref DiscordWebhookUrlParamName
          # ASSESSMENT_BUCKET_NAME is REQUIRED here even though this Lambda does not use it
          # directly: health-report imports a module that transitively pulls in
          # threshold-history-service.ts, which reads ASSESSMENT_BUCKET_NAME at module scope and
          # throws ("Missing required environment variable") if it is absent. A transitive import is
          # enough. Without it every invocation fails in the module initializer, and since the alarm
          # goes to ALARM once and stays there, nobody is re-notified. health-report is the
          # INDEPENDENT cross-check on the SNS alarm path (it calls DescribeAlarms itself, so it
          # still reports even if an SNS message is dropped); health-report-boot.test.ts fails if
          # this regresses.
          ASSESSMENT_BUCKET_NAME: !Ref AssessmentReportBucket
      Tags:
        - { Key: Environment, Value: !Ref Environment }
        - { Key: Project, Value: !Ref Project }
        - { Key: Lifecycle, Value: active }
        - { Key: Owner, Value: platform }

  HealthReportFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${HealthReportFunction}'
      RetentionInDays: 30

  HealthReportFunctionErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${Org}-${Project}-${Environment}-alerting-health-report-fn-errors'
      AlarmDescription: 'HealthReportFunction Errors >= 1 in one cycle - check CloudWatch Logs.'
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref HealthReportFunction
      Statistic: Sum
      Period: 3600
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmNotificationTopic
      OKActions:
        - !Ref AlarmNotificationTopic

  HealthReportScheduleRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${Org}-${Project}-${Environment}-alerting-health-report-scheduler-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: scheduler.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals: { aws:SourceAccount: !Ref AWS::AccountId }
      Policies:
        - PolicyName: invoke-health-report-lambda
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt HealthReportFunction.Arn
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt SchedulerDeadLetterQueue.Arn

  HealthReportSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: !Sub '${Org}-${Project}-${Environment}-alerting-health-report'
      Description: Post a Discord embed summarizing system health every 15 minutes (see HealthReportScheduleExpression).
      FlexibleTimeWindow: { Mode: 'OFF' }
      ScheduleExpression: !Ref HealthReportScheduleExpression
      State: ENABLED
      Target:
        Arn: !GetAtt HealthReportFunction.Arn
        RoleArn: !GetAtt HealthReportScheduleRole.Arn
        RetryPolicy:
          MaximumRetryAttempts: 2
          MaximumEventAgeInSeconds: 3600
        DeadLetterConfig:
          Arn: !GetAtt SchedulerDeadLetterQueue.Arn

  # --- IAM: patch-scheduler-fn (patches on/off-scheduled instances >= 30 minutes after start,
  # replacing a fixed Quick Setup Patch Policy cron that works poorly for scheduled instances).
  # Needs ec2:DescribeInstances (survey running instances + the Schedule:Start/LastPatchCommandId/
  # LastPatchVerifiedDate tags) + ec2:CreateTags/DeleteTags (write/remove those 2 tags only, no
  # other tag) + ssm:DescribeInstanceInformation (check the SSM Agent is online) + ssm:SendCommand
  # (sends AWS-RunPatchBaseline, scoped by document ARN + instance ARN) + ssm:GetCommandInvocation
  # (verify the patch result, Resource "*" because this API has no resource-level ARN). ---
  PatchSchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${Org}-${Project}-${Environment}-governance-patch-scheduler-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: patch-scheduler-discover-and-tag
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ec2:DescribeInstances
                Resource: '*'
              - Effect: Allow
                Action: [ec2:CreateTags, ec2:DeleteTags]
                Resource: !Sub 'arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:instance/*'
                Condition:
                  # The sub-key suffix is a LITERAL string, NOT derived from a code constant. It
                  # must match patchScheduling.ts's LAST_PATCH_COMMAND_ID_TAG_KEY/LAST_PATCH_VERIFIED_DATE_TAG_KEY
                  # (LastPatchCommandId/LastPatchVerifiedDate).
                  # patchScheduling.ts's LAST_PATCH_COMMAND_ID_TAG_KEY/LAST_PATCH_VERIFIED_DATE_TAG_KEY.
                  ForAllValues:StringEquals:
                    aws:TagKeys: [!Sub '${TagPrefix}:LastPatchCommandId', !Sub '${TagPrefix}:LastPatchVerifiedDate']
        - PolicyName: patch-scheduler-ssm-patch
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ssm:DescribeInstanceInformation
                Resource: '*'
              - Effect: Allow
                Action: ssm:SendCommand
                Resource:
                  - !Sub 'arn:aws:ssm:${AWS::Region}::document/AWS-RunPatchBaseline'
                  - !Sub 'arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:instance/*'
              - Effect: Allow
                # GetCommandInvocation does not support resource-level ARNs (like
                # DescribeInstanceInformation above), so Resource: '*' is required per the SSM IAM
                # reference, unlike SendCommand.
                Action: ssm:GetCommandInvocation
                Resource: '*'
        - PolicyName: patch-scheduler-discord-webhook
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${DiscordWebhookUrlParamName}'
              # SecureString requires kms:Decrypt separately from ssm:GetParameter, scoped via
              # kms:ViaService (not a specific key Resource ARN - the AWS-managed `alias/aws/ssm`
              # key's real ARN is account-specific, same rationale as AiOpsAgentRole's
              # DecryptClaudeApiKeyViaSsmOnly statement) so this grant cannot decrypt anything
              # outside an SSM GetParameter call.
              - Effect: Allow
                Action: kms:Decrypt
                Resource: '*'
                Condition:
                  StringEquals:
                    kms:ViaService: !Sub 'ssm.${AWS::Region}.amazonaws.com'

  PatchSchedulerFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${Org}-${Project}-${Environment}-governance-patch-scheduler-fn'
      Runtime: nodejs22.x
      Architectures: [arm64]
      Handler: index.handler
      Timeout: 60
      MemorySize: 256
      Role: !GetAtt PatchSchedulerRole.Arn
      Code: ./build/patch-scheduler
      Environment:
        Variables:
          # These 3 variables MUST be set identically on EVERY Lambda that reads/writes this
          # stack's EC2 tags (Ec2RightsizeApplierFunction, InfraReviewCollectorFunction), see
          # backend/src/modules/ec2-management/tagConventions.ts. Setting them differently between Lambdas
          # causes silent tag mismatches (for example patch-scheduler-fn writing tags with a new
          # TagPrefix while infra-review-collector-fn still reads with the old default).
          TAG_PREFIX: !Ref TagPrefix
          SCHEDULE_TAG_KEY: !Ref ScheduleTagKey
          PATCH_TIMEZONE: !Ref PatchTimezone
          DISCORD_WEBHOOK_URL_PARAM_NAME: !Ref DiscordWebhookUrlParamName
      Tags:
        - { Key: Environment, Value: !Ref Environment }
        - { Key: Project, Value: !Ref Project }
        - { Key: Lifecycle, Value: active }
        - { Key: Owner, Value: platform }

  PatchSchedulerFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${PatchSchedulerFunction}'
      RetentionInDays: 30

  PatchSchedulerFunctionErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${Org}-${Project}-${Environment}-governance-patch-scheduler-fn-errors'
      AlarmDescription: 'PatchSchedulerFunction Errors >= 1 in one cycle - check CloudWatch Logs.'
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref PatchSchedulerFunction
      Statistic: Sum
      Period: 600
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmNotificationTopic
      OKActions:
        - !Ref AlarmNotificationTopic

  PatchSchedulerScheduleRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${Org}-${Project}-${Environment}-governance-patch-scheduler-scheduler-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: scheduler.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals: { aws:SourceAccount: !Ref AWS::AccountId }
      Policies:
        - PolicyName: invoke-patch-scheduler-lambda
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt PatchSchedulerFunction.Arn
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt SchedulerDeadLetterQueue.Arn

  PatchSchedulerSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: !Sub '${Org}-${Project}-${Environment}-governance-patch-scheduler'
      Description: Patch instances tagged Schedule:Start that have been running >= 30 minutes and are not patched today (see PatchSchedulerScheduleExpression).
      FlexibleTimeWindow: { Mode: 'OFF' }
      ScheduleExpression: !Ref PatchSchedulerScheduleExpression
      State: ENABLED
      Target:
        Arn: !GetAtt PatchSchedulerFunction.Arn
        RoleArn: !GetAtt PatchSchedulerScheduleRole.Arn
        RetryPolicy:
          MaximumRetryAttempts: 2
          MaximumEventAgeInSeconds: 3600
        DeadLetterConfig:
          Arn: !GetAtt SchedulerDeadLetterQueue.Arn

  # --- IAM: ec2-rightsize-applier-fn (the EXECUTION half of EC2_AutoRightsize, see
  # lib/ec2AutoRightsizing.ts/ec2-rightsize-applier.ts). Triggered by the EventBridge Rule "EC2
  # Instance State-change Notification" (an event-driven Lambda, not an EventBridge Scheduler
  # one). Least privilege: read instance/family sizes (Describe*), change InstanceType
  # (ModifyInstanceAttribute, scoped to instance/*), read/delete/write only this mechanism's 2
  # tags (scoped with a TagKeys condition), read the Discord webhook (ssm:GetParameter), write the
  # audit trail (s3:PutObject scoped to the action-audit/* prefix, same bucket/prefix as
  # action-audit-service.ts but with its own S3Client, see the comment in
  # ec2-rightsize-applier.ts for why it does NOT import config.ts). ---
  Ec2RightsizeApplierRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${Org}-${Project}-${Environment}-governance-rightsize-applier-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: ec2-rightsize-applier-read-and-modify
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [ec2:DescribeInstances, ec2:DescribeInstanceTypes]
                Resource: '*'
              - Effect: Allow
                Action: ec2:ModifyInstanceAttribute
                Resource: !Sub 'arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:instance/*'
              - Effect: Allow
                Action: [ec2:CreateTags, ec2:DeleteTags]
                Resource: !Sub 'arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:instance/*'
                Condition:
                  # The sub-key suffix is a LITERAL string, NOT derived from a code constant. It
                  # must match ec2AutoRightsizing.ts's PENDING_AUTO_RIGHTSIZE_TAG_KEY/
                  # LAST_AUTO_RIGHTSIZE_DATE_TAG_KEY (PendingAutoRightsize/LastAutoRightsizeDate).
                  ForAllValues:StringEquals:
                    aws:TagKeys: [!Sub '${TagPrefix}:PendingAutoRightsize', !Sub '${TagPrefix}:LastAutoRightsizeDate']
              # Re-queries Compute Optimizer at the moment the instance stops (see
              # resolveRightsizeTarget in ec2-rightsize-applier.ts) to get the latest
              # recommendationOptions and decide whether to apply a recommendation for a DIFFERENT
              # family (only when migrationEffort=VeryLow and there are no platformDifferences, see
              # lib/ec2AutoRightsizing.ts#pickSafeCrossFamilyRecommendation). This action does NOT
              # support resource-level permissions (same pattern as InfraReviewCollectorRole).
              - Effect: Allow
                Action: compute-optimizer:GetEC2InstanceRecommendations
                Resource: '*'
              - Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${DiscordWebhookUrlParamName}'
              # SecureString requires kms:Decrypt separately from ssm:GetParameter, scoped via
              # kms:ViaService (not a specific key Resource ARN - the AWS-managed `alias/aws/ssm`
              # key's real ARN is account-specific, same rationale as AiOpsAgentRole's
              # DecryptClaudeApiKeyViaSsmOnly statement) so this grant cannot decrypt anything
              # outside an SSM GetParameter call.
              - Effect: Allow
                Action: kms:Decrypt
                Resource: '*'
                Condition:
                  StringEquals:
                    kms:ViaService: !Sub 'ssm.${AWS::Region}.amazonaws.com'
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub '${AssessmentReportBucket.Arn}/action-audit/*'

  Ec2RightsizeApplierFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${Org}-${Project}-${Environment}-governance-rightsize-applier-fn'
      Runtime: nodejs22.x
      Architectures: [arm64]
      Handler: index.handler
      Timeout: 30
      MemorySize: 256
      Role: !GetAtt Ec2RightsizeApplierRole.Arn
      Code: ./build/ec2-rightsize-applier
      Environment:
        Variables:
          ASSESSMENT_BUCKET_NAME: !Ref AssessmentReportBucket
          DISCORD_WEBHOOK_URL_PARAM_NAME: !Ref DiscordWebhookUrlParamName
          AWS_ACCOUNT_ID: !Ref AWS::AccountId
          # See the comment on PatchSchedulerFunction about the required consistency across Lambdas.
          TAG_PREFIX: !Ref TagPrefix
          SCHEDULE_TAG_KEY: !Ref ScheduleTagKey
          PATCH_TIMEZONE: !Ref PatchTimezone
      Tags:
        - { Key: Environment, Value: !Ref Environment }
        - { Key: Project, Value: !Ref Project }
        - { Key: Lifecycle, Value: active }
        - { Key: Owner, Value: platform }

  Ec2RightsizeApplierFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${Ec2RightsizeApplierFunction}'
      RetentionInDays: 30

  Ec2RightsizeApplierFunctionErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${Org}-${Project}-${Environment}-governance-rightsize-applier-fn-errors'
      AlarmDescription: 'Ec2RightsizeApplierFunction Errors >= 1 in one cycle - check CloudWatch Logs.'
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref Ec2RightsizeApplierFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmNotificationTopic
      OKActions:
        - !Ref AlarmNotificationTopic

  # DownsizeSchedulerFunction: reusable Lambda for one-off manual RDS/EC2 downsizes (confirmed via
  # chat, NOT the automatic Compute Optimizer flow, see Ec2RightsizeApplierFunction above for the
  # automatic case). It takes the resource and target class/type from the EVENT PAYLOAD, not from
  # environment variables. Each downsize only needs one EventBridge Scheduler one-time schedule
  # created DIRECTLY VIA THE API (aws scheduler create-schedule, not CloudFormation, because these
  # are created/edited/deleted dynamically) with a different Target.Input pointing at this Lambda,
  # so the stack does not need to be redeployed for the next downsize.
  DownsizeSchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${Org}-${Project}-${Environment}-governance-downsize-scheduler-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: downsize-scheduler-rds-ec2-modify
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: rds:ModifyDBInstance
                Resource: !Sub 'arn:aws:rds:${AWS::Region}:${AWS::AccountId}:db:*'
              - Effect: Allow
                Action: [ec2:DescribeInstances, ec2:StopInstances, ec2:StartInstances, ec2:ModifyInstanceAttribute]
                Resource: '*'
              - Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${DiscordWebhookUrlParamName}'
              # SecureString requires kms:Decrypt separately from ssm:GetParameter, scoped via
              # kms:ViaService (not a specific key Resource ARN - the AWS-managed `alias/aws/ssm`
              # key's real ARN is account-specific, same rationale as AiOpsAgentRole's
              # DecryptClaudeApiKeyViaSsmOnly statement) so this grant cannot decrypt anything
              # outside an SSM GetParameter call.
              - Effect: Allow
                Action: kms:Decrypt
                Resource: '*'
                Condition:
                  StringEquals:
                    kms:ViaService: !Sub 'ssm.${AWS::Region}.amazonaws.com'

  # Dedicated role for EventBridge Scheduler (created via the CLI, see the comment on
  # DownsizeSchedulerFunction) allowed to call lambda:InvokeFunction on DownsizeSchedulerFunction.
  # NOT shared with DownsizeSchedulerRole (the Lambda's own execution role), because they are two
  # different principals (scheduler.amazonaws.com invokes the Lambda, lambda.amazonaws.com is the
  # Lambda running itself).
  DownsizeSchedulerInvokeRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${Org}-${Project}-${Environment}-governance-downsize-scheduler-invoke-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: scheduler.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: downsize-scheduler-invoke-lambda
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt DownsizeSchedulerFunction.Arn

  DownsizeSchedulerFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${Org}-${Project}-${Environment}-governance-downsize-scheduler-fn'
      Runtime: nodejs22.x
      Architectures: [arm64]
      Handler: index.handler
      Timeout: 360
      MemorySize: 256
      Role: !GetAtt DownsizeSchedulerRole.Arn
      Code: ./build/downsize-scheduler
      Environment:
        Variables:
          DISCORD_WEBHOOK_URL_PARAM_NAME: !Ref DiscordWebhookUrlParamName
      Tags:
        - { Key: Environment, Value: !Ref Environment }
        - { Key: Project, Value: !Ref Project }
        - { Key: Lifecycle, Value: active }
        - { Key: Owner, Value: platform }

  DownsizeSchedulerFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${DownsizeSchedulerFunction}'
      RetentionInDays: 30

  DownsizeSchedulerFunctionErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${Org}-${Project}-${Environment}-governance-downsize-scheduler-fn-errors'
      AlarmDescription: 'DownsizeSchedulerFunction Errors >= 1 in one cycle - check CloudWatch Logs.'
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref DownsizeSchedulerFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmNotificationTopic
      OKActions:
        - !Ref AlarmNotificationTopic

  # --- IAM: time-of-day-trigger-fn (thin Lambda that reads the PolicyStore schedule and invokes
  # DownsizeSchedulerFunction before/after peak hours). Least privilege: read instances
  # (DescribeInstances, DescribeInstanceTypes to check CPU architecture compatibility), READ-ONLY S3
  # scoped to the timeofday-schedule/* prefix (this function never rewrites the schedule), invoke
  # ONLY DownsizeSchedulerFunction (scoped ARN), read the Discord webhook. ---
  TimeOfDayTriggerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${Org}-${Project}-${Environment}-governance-timeofday-trigger-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: time-of-day-trigger-read-and-invoke
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [ec2:DescribeInstances, ec2:DescribeInstanceTypes]
                Resource: '*'
              # time-of-day-trigger.ts ONLY calls s3PolicyStore.getComputedSchedule (read) and never
              # rewrites the schedule (assessment-report-builder.ts does that, running in
              # InfraReviewCollectorFunction with its own role), so s3:PutObject is intentionally
              # omitted here (least privilege).
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub '${AssessmentReportBucket.Arn}/timeofday-schedule/*'
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt DownsizeSchedulerFunction.Arn
              - Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${DiscordWebhookUrlParamName}'
              # SecureString requires kms:Decrypt separately from ssm:GetParameter, scoped via
              # kms:ViaService (not a specific key Resource ARN - the AWS-managed `alias/aws/ssm`
              # key's real ARN is account-specific, same rationale as AiOpsAgentRole's
              # DecryptClaudeApiKeyViaSsmOnly statement) so this grant cannot decrypt anything
              # outside an SSM GetParameter call.
              - Effect: Allow
                Action: kms:Decrypt
                Resource: '*'
                Condition:
                  StringEquals:
                    kms:ViaService: !Sub 'ssm.${AWS::Region}.amazonaws.com'

  TimeOfDayTriggerFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${Org}-${Project}-${Environment}-governance-timeofday-trigger-fn'
      Runtime: nodejs22.x
      Architectures: [arm64]
      Handler: index.handler
      Timeout: 60
      MemorySize: 256
      Role: !GetAtt TimeOfDayTriggerRole.Arn
      Code: ./build/time-of-day-trigger
      Environment:
        Variables:
          ASSESSMENT_BUCKET_NAME: !Ref AssessmentReportBucket
          DISCORD_WEBHOOK_URL_PARAM_NAME: !Ref DiscordWebhookUrlParamName
          DOWNSIZE_SCHEDULER_FUNCTION_ARN: !GetAtt DownsizeSchedulerFunction.Arn
          # AWS_ACCOUNT_ID is REQUIRED here: without it this Lambda fails in its module initializer
          # on EVERY invocation ("Missing required environment variable: AWS_ACCOUNT_ID"), and the
          # time-of-day rightsizing trigger silently does nothing. See
          # time-of-day-trigger-boot.test.ts.
          AWS_ACCOUNT_ID: !Ref AWS::AccountId
          # See the comment on PatchSchedulerFunction about the required consistency across Lambdas.
          TAG_PREFIX: !Ref TagPrefix
          SCHEDULE_TAG_KEY: !Ref ScheduleTagKey
          PATCH_TIMEZONE: !Ref PatchTimezone
      Tags:
        - { Key: Environment, Value: !Ref Environment }
        - { Key: Project, Value: !Ref Project }
        - { Key: Lifecycle, Value: active }
        - { Key: Owner, Value: platform }

  TimeOfDayTriggerFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${TimeOfDayTriggerFunction}'
      RetentionInDays: 30

  TimeOfDayTriggerFunctionErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${Org}-${Project}-${Environment}-governance-timeofday-trigger-fn-errors'
      AlarmDescription: 'TimeOfDayTriggerFunction Errors >= 1 in one cycle - check CloudWatch Logs.'
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref TimeOfDayTriggerFunction
      Statistic: Sum
      Period: 900
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmNotificationTopic
      OKActions:
        - !Ref AlarmNotificationTopic

  TimeOfDayTriggerScheduleRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${Org}-${Project}-${Environment}-gov-timeofday-trigger-sched-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: scheduler.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals: { aws:SourceAccount: !Ref AWS::AccountId }
      Policies:
        - PolicyName: invoke-time-of-day-trigger-lambda
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt TimeOfDayTriggerFunction.Arn
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt SchedulerDeadLetterQueue.Arn

  TimeOfDaySchedulerSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: !Sub '${Org}-${Project}-${Environment}-governance-timeofday-trigger'
      Description: Read the computed peak/off-peak schedule and invoke DownsizeSchedulerFunction before/after peak hours (see TimeOfDaySchedulerScheduleExpression).
      FlexibleTimeWindow: { Mode: 'OFF' }
      ScheduleExpression: !Ref TimeOfDaySchedulerScheduleExpression
      State: ENABLED
      Target:
        Arn: !GetAtt TimeOfDayTriggerFunction.Arn
        RoleArn: !GetAtt TimeOfDayTriggerScheduleRole.Arn
        RetryPolicy:
          MaximumRetryAttempts: 2
          MaximumEventAgeInSeconds: 3600
        DeadLetterConfig:
          Arn: !GetAtt SchedulerDeadLetterQueue.Arn

  # --- SSM Parameter: kill switch for the AI Ops Agent. ai-ops-agent-fn reads it FRESH on every run
  # (no caching across invocations, see lib/agentKillSwitch.ts). Set the value through the
  # AgentAutoExecuteEnabledValue parameter (redeploy) OR directly with `aws ssm put-parameter`
  # (takes effect IMMEDIATELY without redeploying the stack). That is the reason the kill switch
  # exists: an operator who sees the agent misbehave must be able to stop it at once. ---
  AiOpsAgentKillSwitchParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/${Org}/${Project}/${Environment}/agent-auto-execute-enabled'
      Type: String
      Value: !Ref AgentAutoExecuteEnabledValue
      Description: >-
        Kill switch for the AI Ops Agent. ONLY 'true' (exact, case-sensitive) enables auto-execution.
        Read fresh on every run (no cache) by ai-ops-agent-fn. Change it in the console/CLI to stop
        the agent immediately without redeploying.

  # --- IAM: ai-ops-agent-fn. DELIBERATELY MINIMAL PERMISSIONS:
  #  - Calls the Anthropic Claude API DIRECTLY over HTTPS (not through AWS Bedrock), so NO Bedrock
  #    IAM permission is needed. The only LLM-related AWS permission is
  #    ssm:GetParameter(WithDecryption) + kms:Decrypt on the single SecureString parameter holding
  #    the API key (see AgentClaudeApiKeyParamName). The model itself has no AWS permission and
  #    cannot execute anything on its own (see lib/agentClaudeDecision.ts).
  #  - s3:GetObject ONLY on assessment-report.json (reads findings, the same object
  #    InfraReviewCollectorRole writes) + s3:GetObject/PutObject ONLY on the agent-state/* prefix
  #    (rate-limit.json, see lib/agentRateLimiter.ts). No access to any other object in the bucket,
  #    and NEVER s3:PutObject on action-audit/* (the audit trail is written only by
  #    action-execution-fn, never directly by this Lambda).
  #  - ssm:GetParameter ONLY on the 2 required parameters (kill switch + Discord webhook), no Put*.
  #  - lambda:InvokeFunction SCOPED to exactly 1 ARN, ActionExecutionFunction. This is the most
  #    important boundary of the feature: this role has NO permission of its own to mutate any AWS
  #    resource (no ec2:*, rds:*, s3:PutLifecycleConfiguration...). EVERY real infrastructure
  #    change goes through ActionExecutionRole (shared with the human clicking the button), with
  #    all of each service's own safety checks (re-verifying state at execution time, etc.)
  #    unchanged for this flow. ---
  AiOpsAgentRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${Org}-${Project}-${Environment}-agent-ai-ops-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        # Anthropic Claude API key: SCOPED to exactly the 1 SecureString parameter named by
        # AgentClaudeApiKeyParamName. This parameter is NOT created by this stack (see that
        # parameter's own Description) - the ARN is built manually via Fn::Sub rather than
        # referencing a CFN-managed resource, since none exists here. kms:Decrypt is required
        # separately from ssm:GetParameter for a SecureString value encrypted with the AWS-managed
        # `alias/aws/ssm` key; scoped via the kms:ViaService condition (not Resource, since the
        # managed key's real ARN is account-specific and not derivable here) so this grant cannot
        # be used to decrypt anything outside an SSM GetParameter call.
        - PolicyName: ai-ops-agent-claude-api-key-read
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReadClaudeApiKeyParameter
                Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${AgentClaudeApiKeyParamName}'
              - Sid: DecryptClaudeApiKeyViaSsmOnly
                Effect: Allow
                Action: kms:Decrypt
                Resource: '*'
                Condition:
                  StringEquals:
                    kms:ViaService: !Sub 'ssm.${AWS::Region}.amazonaws.com'
        - PolicyName: ai-ops-agent-read-assessment-report
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReadAssessmentReport
                Effect: Allow
                Action: s3:GetObject
                Resource: !Sub '${AssessmentReportBucket.Arn}/assessment-report.json'
              - Sid: RateLimitStateReadWrite
                Effect: Allow
                Action: [s3:GetObject, s3:PutObject]
                Resource: !Sub '${AssessmentReportBucket.Arn}/agent-state/*'
        - PolicyName: ai-ops-agent-ssm-read
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ssm:GetParameter
                Resource:
                  - !GetAtt AiOpsAgentKillSwitchParameter.Arn
                  - !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${DiscordWebhookUrlParamName}'
              # DiscordWebhookUrlParamName is a SecureString, so kms:Decrypt is needed separately,
              # scoped via kms:ViaService (see DecryptClaudeApiKeyViaSsmOnly above for the same
              # pattern/rationale). AiOpsAgentKillSwitchParameter stays plain String (a boolean
              # flag, not a secret), so no kms:Decrypt is needed for that one.
              - Effect: Allow
                Action: kms:Decrypt
                Resource: '*'
                Condition:
                  StringEquals:
                    kms:ViaService: !Sub 'ssm.${AWS::Region}.amazonaws.com'
        - PolicyName: ai-ops-agent-invoke-action-execution-only
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: InvokeActionExecutionOnly
                Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt ActionExecutionFunction.Arn

  AiOpsAgentFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${Org}-${Project}-${Environment}-agent-ai-ops-fn'
      Runtime: nodejs22.x
      Architectures: [arm64]
      Handler: index.handler
      Timeout: 60
      MemorySize: 256
      Role: !GetAtt AiOpsAgentRole.Arn
      Code: ./build/ai-ops-agent
      Environment:
        Variables:
          ASSESSMENT_BUCKET_NAME: !Ref AssessmentReportBucket
          ACTION_EXECUTION_FUNCTION_NAME: !Ref ActionExecutionFunction
          AGENT_KILL_SWITCH_PARAM_NAME: !Ref AiOpsAgentKillSwitchParameter
          DISCORD_WEBHOOK_URL_PARAM_NAME: !Ref DiscordWebhookUrlParamName
          AGENT_CLAUDE_MODEL_ID: !Ref AgentClaudeModelId
          AGENT_CLAUDE_API_KEY_PARAM_NAME: !Ref AgentClaudeApiKeyParamName
      Tags:
        - { Key: Environment, Value: !Ref Environment }
        - { Key: Project, Value: !Ref Project }
        - { Key: Lifecycle, Value: active }
        - { Key: Owner, Value: platform }

  AiOpsAgentFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AiOpsAgentFunction}'
      RetentionInDays: 30

  AiOpsAgentFunctionErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${Org}-${Project}-${Environment}-agent-ai-ops-fn-errors'
      AlarmDescription: 'AiOpsAgentFunction Errors >= 1 in one cycle - check CloudWatch Logs.'
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref AiOpsAgentFunction
      Statistic: Sum
      Period: 1800
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmNotificationTopic
      OKActions:
        - !Ref AlarmNotificationTopic

  AiOpsAgentScheduleRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${Org}-${Project}-${Environment}-agent-ai-ops-scheduler-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: scheduler.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals: { aws:SourceAccount: !Ref AWS::AccountId }
      Policies:
        - PolicyName: invoke-ai-ops-agent-lambda
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt AiOpsAgentFunction.Arn
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt SchedulerDeadLetterQueue.Arn

  AiOpsAgentSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: !Sub '${Org}-${Project}-${Environment}-agent-ai-ops'
      Description: >-
        Read assessment-report.json and (if the kill switch = true) automatically run a few safe
        actions from a fixed allow-list (see AiOpsAgentScheduleExpression).
      FlexibleTimeWindow: { Mode: 'OFF' }
      ScheduleExpression: !Ref AiOpsAgentScheduleExpression
      State: ENABLED
      Target:
        Arn: !GetAtt AiOpsAgentFunction.Arn
        RoleArn: !GetAtt AiOpsAgentScheduleRole.Arn
        RetryPolicy:
          MaximumRetryAttempts: 2
          MaximumEventAgeInSeconds: 3600
        DeadLetterConfig:
          Arn: !GetAtt SchedulerDeadLetterQueue.Arn

  ScheduledActionsMutateRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${Org}-${Project}-${Environment}-action-schedule-mutate-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: scheduled-actions-mutate-scheduler
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - scheduler:CreateSchedule
                  - scheduler:DeleteSchedule
                Resource: !Sub 'arn:aws:scheduler:${AWS::Region}:${AWS::AccountId}:schedule/default/abc-prod-downsize-*'
              - Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt DownsizeSchedulerInvokeRole.Arn

  ScheduledActionsMutateFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${Org}-${Project}-${Environment}-action-schedule-mutate-fn'
      Runtime: nodejs22.x
      Architectures: [arm64]
