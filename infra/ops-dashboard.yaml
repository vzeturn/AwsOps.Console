      Tags:
        - { Key: Environment, Value: !Ref Environment }
        - { Key: Project, Value: !Ref Project }
        - { Key: Lifecycle, Value: active }
        - { Key: Owner, Value: platform }

  ApprovalMutateFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${ApprovalMutateFunction}'
      RetentionInDays: 30

  ApprovalMutateFunctionErrorsAlarm:
