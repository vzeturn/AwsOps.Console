                    kms:ViaService: !Sub 'ssm.${AWS::Region}.amazonaws.com'

  SecurityEndpointDriftDetectorFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${Org}-${Project}-${Environment}-security-endpoint-drift-detector-fn'
      Runtime: nodejs22.x
