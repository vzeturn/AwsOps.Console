AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::LanguageExtensions
# NOTE when editing `Description` below: CloudFormation limits Description to 1024 characters, and the
# limit is only enforced at deploy time (ValidationError), not by `package`. Keep longer explanations
# in COMMENTS like this block (comments do not count toward the limit), not in Description.
#
# --- Architecture details (this part does not count toward the 1024 limit) ---
#
# NOT read-only: the stack exposes POST /actions/* routes (EC2/RDS lifecycle, instance type changes,
# security group edits, SSM Run Command, scheduled actions) and several Lambdas change resources on
# their own (patch-scheduler, ec2-rightsize-applier, time-of-day sizing). Mutating routes are gated
# by OperatorGroupIds (separate from AllowedGroupIds, the general sign-in gate), and every execution
# writes an audit record under the `action-audit/` prefix of AssessmentReportBucket.
#
# CORE COST RULE: every billed AWS API is called only by a SCHEDULED collector, never on the user
# request path. The bill therefore depends on the schedule, not on the number of users or open tabs.
#   - cost-collector (rate 6h)       : the ONLY caller of Cost Explorer GetCostAndUsage.
#   - infra-collector (rate 5 min)   : writes infra-cache.json / compliance-cache.json to S3.
#   - infra-review-collector (1 day) : writes assessment-report.json.
#   - GET /monitoring                : lazy write-through cache (monitoring-cache.json) with a TTL;
#                                      cloudwatch:GetMetricData is billed per metric, so the TTL is
#                                      the cost ceiling.
# An earlier design called GetMetricData directly on every request while the frontend polled every
# 45s with refetchIntervalInBackground:true, so a single forgotten background tab could produce an
# unbounded bill. See the cost table in README.md.
#
# Caches live in S3 rather than SSM Parameter Store because the Standard tier limits a value to
# 4096 bytes, which is smaller than the real payloads (S3 has no practical limit and is cheaper than
# SSM Advanced tier).
Description: >-
  ops-dashboard: operations dashboard (monitoring / infra / compliance and backup / cost).
  Not read-only: it has POST /actions/* routes and Lambdas that change resources automatically
  (gated by OperatorGroupIds, with audit records in S3 under action-audit/). Architecture: two
  Lambda Function URLs (static-server + router, authType NONE, Entra ID SSO with JWT verified in
  the router) plus scheduled collector Lambdas. COST RULE: billed AWS APIs (Cost Explorer,
  CloudWatch GetMetricData) are called only by scheduled collectors or a TTL cache, never per
  request, so the bill depends on the schedule and not on the number of open tabs. See the cost
  table in README.md and the comment block above. No API Gateway, Cognito or DynamoDB. Deployed
  with plain `aws cloudformation package` + `deploy` (no CDK), see infra/deploy.sh.

Parameters:
  Org:
    Type: String
    Default: abc
  Project:
    Type: String
    Default: ops-dashboard
  Environment:
    Type: String
    Default: prod
    AllowedValues: [dev, staging, prod]
  ServiceName:
    Type: String
    Default: ops-dashboard
  EntraTenantId:
    Type: String
    Description: Microsoft Entra ID tenant ID (GUID).
  EntraClientId:
    Type: String
    Description: Entra ID App Registration client ID (SPA, PKCE, no secret) dedicated to ops-dashboard.
  AllowedGroupIds:
    Type: String
    Default: ''
    Description: Comma-separated Entra ID group Object IDs allowed to use the app. Empty = any authenticated user.
  OperatorGroupIds:
    Type: String
    Default: ''
    Description: >-
      Comma-separated Entra ID group Object IDs allowed to run resource lifecycle actions
      (EC2_Reboot/RDS_Start/RDS_Stop/RDS_Reboot) from the Infra tab. Separate from AllowedGroupIds
      (the general sign-in gate). Empty = nobody has operator rights (safer default). This differs
      from an empty AllowedGroupIds, which means no group restriction.
  InfraCollectorScheduleExpression:
    Type: String
    Default: 'rate(5 minutes)'
    Description: >-
      How often infra-collector refreshes infra-cache.json/compliance-cache.json in
      AssessmentReportBucket. The APIs called here (ec2/rds/elb/backup/dlm/config Describe*) are
      free, so this parameter does not affect the bill, only the freshness of the Infra/Compliance
      tabs. It does NOT write monitoring-cache.json: the Monitoring tab uses a lazy TTL cache in the
      router (see backend/src/handlers/get-monitoring.ts) because cloudwatch:GetMetricData is billed
      and a fixed schedule would cost more than the real traffic justifies.
  SiteUrl:
    Type: String
    Description: Public URL of the static-server Function URL (fill in after the first deploy; used as redirect_uri).
  AdditionalAllowedOrigins:
    Type: String
    Default: ''
    Description: >-
      CSV of origins (scheme://host form, NO trailing "/") allowed to call the router in addition to
      the origin derived from SiteUrl. Purpose: run two frontends side by side for testing/rollback,
      for example the Lambda static-server (SiteUrl) and a Cloudflare Workers deployment
      (https://ops-dashboard.<subdomain>.workers.dev). With only SiteUrl set, enabling the second
      frontend would break CORS for the first one, and vice versa.
      NOTE: every origin listed here must also be a Redirect URI on the Entra ID App Registration,
      otherwise sign-in fails with AADSTS50011 (redirect_uri mismatch).
  CostCollectorScheduleExpression:
    Type: String
    Default: rate(6 hours)
    Description: How often cost-collector calls Cost Explorer (about $0.05 per run of 5 API calls). Every 6h (4 runs/day) is roughly $0.20/day (estimate).
  InfraReviewScheduleExpression:
    Type: String
    Default: rate(1 day)
    Description: How often infra-review-collector surveys the infrastructure and calls CloudWatch/Cost Explorer (billed). Once a day.
  Ec2StateManagerFunctionUrl:
    Type: String
    Description: Lambda Function URL (AuthType NONE) of an external state-manager service. Fill in after deploying it; action-execution-fn uses it for EC2 start/stop.
  Ec2StateManagerServiceTokenParamName:
    Type: String
    Default: '/abc/ops-dashboard/prod/ec2-state-manager-service-token'
    Description: >-
      NAME (not the value) of an SSM SecureString parameter holding the shared secret sent in the
      x-service-token header when calling the external state-manager service. SecureString gives
      encryption at rest, which is enough here; use Secrets Manager instead if you need automatic
      rotation. This follows the same pattern as AgentClaudeApiKeyParamName. CloudFormation cannot
      create SecureString SSM parameters, so this parameter only declares the NAME; the secret value
      never passes through CloudFormation parameters or stack events (where it would show up in
      plaintext in CloudTrail).
      Create or update the parameter MANUALLY before deploying (the value must match the service
      token configured on the state-manager service):
        aws ssm put-parameter --name "<value of this parameter>" --type SecureString --value "<token>" --overwrite
      Each Lambda role that reads it gets ssm:GetParameter (WithDecryption) and kms:Decrypt
      (scoped with kms:ViaService=ssm, default aws/ssm key) on this parameter's ARN only.
  DiscordWebhookUrlParamName:
    Type: String
    Default: '/abc/ops-dashboard/prod/discord-webhook-url'
    Description: >-
      NAME (not the value) of an SSM SecureString parameter holding the Discord Incoming Webhook URL
      (https://discord.com/api/webhooks/<id>/<token>), the only receiver of CloudWatch Alarm
      notifications. See Ec2StateManagerServiceTokenParamName above for why only the name is declared.
      Create or update the parameter MANUALLY before deploying:
        aws ssm put-parameter --name "<value of this parameter>" --type SecureString --value "<webhook url>" --overwrite
      Each Lambda role that reads it gets ssm:GetParameter (WithDecryption) and kms:Decrypt
      (scoped with kms:ViaService=ssm) on this parameter's ARN only.
  AlarmBaselineScheduleExpression:
    Type: String
    Default: rate(1 hour)
    Description: >-
      How often alarm-baseline-manager-fn re-surveys online resources and reconciles the standard
      alarm set (PutMetricAlarm/DeleteAlarms are not billed per request). Hourly is fast enough to
      pick up newly created or deleted resources without running continuously.
  AlarmBaselineExcludedResources:
    Type: String
    Default: ''
    Description: >-
      CSV of resource identifiers that should NOT get the standard alarms (turns alarms off for one
      resource while keeping the standard set for the rest). Matches EXACTLY (no prefix/substring)
      the id each builder uses: EC2 and host metrics = InstanceId, RDS = DBInstanceIdentifier,
      ALB = load balancer name, ECS = "<cluster>/<service>".
      WHY A PARAMETER AND NOT MANUAL ALARM DELETION: alarm-baseline-manager-fn is a reconcile loop
      that runs rate(1 hour). An alarm deleted in the console is re-created at the next reconcile,
      and DisableAlarmActions is undone by PutMetricAlarm setting ActionsEnabled=true. The only
      place that can express "no alarms for this resource" is the desired set itself. Once excluded,
      the old alarms are removed by the existing orphan-cleanup path (same as for a deleted resource).
      To turn alarms back on, remove the id from this list and deploy; they are re-created at the
      next reconcile.
  HealthReportScheduleExpression:
    Type: String
    Default: rate(15 minutes)
    Description: >-
      How often health-report-fn posts a Discord embed summarizing overall system health
      (DescribeAlarms, free tier). Independent of the SNS state-change path of
      discord-alarm-notifier-fn, so it can detect a missed message on that path.
  PatchSchedulerScheduleExpression:
    Type: String
    Default: rate(10 minutes)
    Description: >-
      How often patch-scheduler-fn checks for instances that carry the ScheduleTagKey tag, have been
      running for at least 30 minutes and have not been patched today. This patches instances on an
      on/off schedule at a time when the SSM Agent is known to be online (instead of a fixed cron,
      which can land while the machine is switched off). Every 10 minutes is fast enough not to miss
      short work shifts and stays inside the Free Tier (SendCommand/DescribeInstanceInformation/
      DescribeInstances/CreateTags are free).
  TimeOfDaySchedulerScheduleExpression:
    Type: String
    Default: rate(15 minutes)
    Description: >-
      How often time-of-day-trigger-fn reads the computed peak/off-peak schedule (PolicyStore) and
      compares it with the current time to invoke DownsizeSchedulerFunction before/after peak hours.
      Must be shorter than PRE_PEAK_LEAD_MINUTES (20 minutes, see lib/timeOfDayPolicy.ts) so a
      window is not missed.
  VpcFlowLogsEnabled:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: >-
      Master on/off for VPC Flow Logs on the two VPCs below (VpcIdPrimary/VpcIdSecondary). Default
      'false' (off, so a new deploy or another account does not incur unexpected cost). Set to
      'true' to enable.
      PURPOSE: this is the only network signal in the stack that answers "which traffic was
      REJECTED by a Security Group/NACL". CloudWatch Alarms (threshold metrics) and GuardDuty
      (confirmed malicious behavior only) cannot show denied connections. Only REJECT traffic is
      logged (not ACCEPT) to keep GB-ingest cost low, since most traffic in a healthy VPC is
      ACCEPT and logging both would multiply the cost without adding detection value.
  VpcIdPrimary:
    Type: String
    Default: vpc-0a1b2c3d4e5f60001
    Description: >-
      First VPC to enable Flow Logs on. Only used when VpcFlowLogsEnabled=true. Change this value
      when deploying to another account or VPC.
  VpcIdSecondary:
    Type: String
    Default: vpc-0a1b2c3d4e5f60002
    Description: >-
      Second VPC to enable Flow Logs on. Only used when VpcFlowLogsEnabled=true. Change this value
      when deploying to another account or VPC.
  AiOpsAgentScheduleExpression:
    Type: String
    Default: rate(30 minutes)
    Description: >-
      How often ai-ops-agent-fn re-reads assessment-report.json and (if AGENT_AUTO_EXECUTE_ENABLED=true)
      automatically runs a few safe, reversible actions from the fixed allow-list in code (see
      lib/agentAutoExecutionPolicy.ts). Every 30 minutes is slow enough not to interfere with
      infra-review-collector-fn (runs once a day and is the source of the findings) and guarantees
      the rate limiter (5 actions/hour, see lib/agentRateLimiter.ts) can never be exceeded by the
      schedule alone.
  AgentAutoExecuteEnabledValue:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: >-
      Kill switch for the AI Ops Agent. ONLY the exact value 'true' enables auto-execution (any
      other value, including empty or a typo, is treated as 'false', see lib/agentKillSwitch.ts).
      DEFAULT 'false': the feature is deployed OFF and runs no action on the infrastructure until
      an operator deliberately sets this to 'true' and redeploys (or uses `aws ssm put-parameter` to
      switch it on/off immediately without redeploying the whole stack, see the SSM parameter
      AiOpsAgentKillSwitchParameter below).
  AgentClaudeModelId:
    Type: String
    Default: 'claude-sonnet-4-6'
    Description: >-
      Claude model id (undated form, generation 4.6 or later, for example "claude-sonnet-4-6" or
      "claude-opus-4-6") that ai-ops-agent-fn sends to the Anthropic Messages API
      (https://api.anthropic.com/v1/messages) only to PRIORITIZE actions already confirmed safe to
      automate (see lib/agentClaudeDecision.ts; the model cannot choose actionType/resourceId, only
      pick from a fixed, pre-filtered list of candidateIds). This is the Anthropic API directly (not
      AWS Bedrock), so no Bedrock IAM permission is needed, only the SSM parameter named by
      AgentClaudeApiKeyParamName below.
  AgentClaudeApiKeyParamName:
    Type: String
    Default: '/abc/ops-dashboard/prod/agent-claude-api-key'
    Description: >-
      NAME (not the value) of an SSM SecureString parameter holding the Anthropic API key
      ("sk-ant-..."). Same pattern as DiscordWebhookUrlParamName/Ec2StateManagerServiceTokenParamName
      (all three declare the name only). CloudFormation cannot create SecureString SSM parameters,
      so this parameter only declares the NAME; the real key never passes through CloudFormation
      parameters or stack events (where it would be logged in plaintext in CloudTrail).
      Create the parameter ONCE manually BEFORE deploying (or redeploy after creating it):
        aws ssm put-parameter --name "<value of this parameter>" --type SecureString --value "sk-ant-..."
      The ai-ops-agent-fn role gets ssm:GetParameter (WithDecryption) on this parameter's ARN only,
      see AiOpsAgentRole below. If the parameter does not exist yet, lib/agentClaudeDecision.ts
      fails safe (selects no action, does NOT throw, does NOT crash the Lambda).
  TagPrefix:
    Type: String
    Default: OpsDashboard
    Description: >-
      Namespace prefix for every EC2 tag that this stack itself writes (for example
      "<TagPrefix>:LastPatchCommandId", "<TagPrefix>:PendingAutoRightsize"). Change it when deploying
      to an account/org that already uses a different tag convention, to avoid clashing with
      existing tags. Does NOT affect ScheduleTagKey (an externally owned on/off tag, see that
      parameter).
      Changing the default requires updating the hardcoded aws:TagKeys literal sub-key suffixes in
      three roles (PatchSchedulerRole, Ec2RightsizeApplierRole, InfraReviewCollectorRole, see the
      comment at each Role) and redeploying every Lambda that reads or writes these tags BEFORE the
      real tags on AWS are renamed. Otherwise patch-scheduler-fn/ec2-rightsize-applier-fn lose
      CreateTags/DeleteTags permission (AccessDenied) because the aws:TagKeys Condition no longer
      matches the new tag key.
  ScheduleTagKey:
    Type: String
    Default: 'Schedule:Start'
    Description: >-
      Tag key (set by an on/off scheduling system EXTERNAL to this stack, not written by it) that
      marks an EC2 instance as taking part in the automated on/off schedule. patch-scheduler-fn and
      ec2-rightsize-applier-fn only consider instances that carry this tag. Change it if your
      org's on/off scheduling convention uses a different name.
      If you change the default, the external system that writes this tag must be reconfigured at
      the same time (for example its TAG_START/TAG_STOP/TAG_EXCLUDE environment variables).
      Otherwise patch-scheduler-fn stops seeing any instance as "schedule-managed" as soon as the
      external system starts writing the new tag key.
  PatchTimezone:
    Type: String
    Default: Asia/Ho_Chi_Minh
    Description: >-
      IANA timezone name (for example "Asia/Ho_Chi_Minh", "America/New_York") used to compute
      "today's date" when comparing date tags (LastPatchCommandId/LastPatchVerifiedDate/
      LastAutoRightsizeDate). It MUST match the real operating hours of the AWS account being
      deployed to, otherwise an instance can be patched/rightsized twice within one business day
      because of a UTC vs local date mismatch.

Conditions:
  # SiteUrl is empty on the first bootstrap deploy (the Function URL is not known yet).
  HasSiteUrl: !Not [!Equals [!Ref SiteUrl, '']]
  # Gate for all VPC Flow Logs resources (log group + role + 2x AWS::EC2::FlowLog), see the
  # VpcFlowLogsEnabled parameter. Default 'false' -> no resource is created and no cost is incurred.
  IsVpcFlowLogsEnabled: !Equals [!Ref VpcFlowLogsEnabled, 'true']

Resources:

  # --- S3: assessment-report.json (infra-review-collector) + cost-cache.json (cost-collector), read
  # by the router. Public access blocked. cost-cache.json used to live in SSM Parameter Store, but
  # the Standard tier allows at most 4096 bytes per value and the real payload is far larger, so it
  # moved to S3 (no practical size limit, cheaper than SSM Advanced tier at $0.05/month). ---
  AssessmentReportBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    Properties:
      BucketName: !Sub '${Org}-${Project}-${Environment}-assessment-report'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      # Versioning: protects the audit trail (action-audit/*) and every collector's overwritten
      # snapshot (assessment-report.json/cost-cache.json/infra-cache.json/etc.) from silent
      # overwrite or accidental delete (AWS WAF Reliability REL09-BP03, ISO/IEC 27001 Annex A
      # A.8.15). Object Lock (WORM, tamper-proof retention) is NOT enabled here: Object Lock can
      # ONLY be turned on when a bucket is CREATED, never added to an existing bucket, so enabling
      # it on an existing deployment would require creating a brand-new bucket and migrating every
      # collector/handler to it. Versioning alone already covers the concrete risk: action-audit/
      # keys are unique per write (see action-audit-service.ts), so audit records are never
      # overwritten, while assessment-report.json/cost-cache.json/infra-cache.json/
      # compliance-cache.json/monitoring-cache.json/topology-cache.json ARE overwritten on every
      # collector run, and versioning is what makes a previous snapshot recoverable after a bad write.
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: expire-threshold-history
            Status: Enabled
            Prefix: threshold-history/
            ExpirationInDays: 2
            # With versioning enabled, ExpirationInDays no longer deletes the object outright — it
            # inserts a delete marker and the previous version becomes NONCURRENT. Without this,
            # every noncurrent version from this already-short-lived prefix would otherwise be
            # kept forever by the bucket-wide rule below being scoped only to CURRENT objects.
            NoncurrentVersionExpiration:
              NoncurrentDays: 2
          # Bucket-wide: bounds the storage growth versioning introduces on every prefix that gets
          # overwritten repeatedly (infra-collector alone runs every 5 minutes by default, see
          # InfraCollectorScheduleExpression, so infra-cache.json/compliance-cache.json/
          # monitoring-cache.json/topology-cache.json would otherwise accumulate an UNBOUNDED
          # number of noncurrent versions). 30 days keeps roughly a month of recoverability for
          # "who overwrote this and when" while keeping the cost bounded and predictable (AWS WAF
          # Cost Optimization COST04-BP05: every dataset needs a retention period). Applies
          # bucket-wide (Prefix: '') including action-audit/*, but this is a no-op for that prefix
          # in practice: every Action_Audit_Record write uses a brand-new, unique S3 key (see
          # action-audit-service.ts's objectKey(), which encodes a random actionId) and is NEVER
          # overwritten, so no noncurrent version is EVER created there for this rule to expire.
          # The audit trail's actual retention is therefore unbounded (no ExpirationInDays targets
          # that prefix), exactly as intended.
          - Id: expire-noncurrent-versions-bucket-wide
            Status: Enabled
            Prefix: ''
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
      Tags:
        - { Key: Environment, Value: !Ref Environment }
        - { Key: Project, Value: !Ref Project }
        - { Key: Lifecycle, Value: active }
        - { Key: Owner, Value: platform }

  # --- IAM: router (read-only Describe/List on EC2/RDS/ELB/Backup/DLM/Config + read 1 SSM param) ---
  RouterRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${Org}-${Project}-${Environment}-web-router-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: read-only-dashboard-sources
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ec2:DescribeInstances
                  - ec2:DescribeVolumes
                  - rds:DescribeDBInstances
                  - elasticloadbalancing:DescribeLoadBalancers
                  - elasticloadbalancing:DescribeTargetGroups
                  - elasticloadbalancing:DescribeTargetHealth
                  # See the comment on InfraCollectorRole about elasticloadbalancing:DescribeTags.
                  # RouterRole also calls loadAlb() (via getInfraData()/loadAlbTargets() on the
                  # request path on a cache miss), so it needs the same permission.
                  - elasticloadbalancing:DescribeTags
                  - ecs:ListClusters
                  - ecs:ListServices
                  - ecs:DescribeServices
                  - backup:ListBackupJobs
                  - dlm:GetLifecyclePolicies
                  - config:DescribeComplianceByConfigRule
                  - cloudwatch:GetMetricData
                  - cloudwatch:ListMetrics
                  - cloudwatch:DescribeAlarms
                  # Read-only, used by preview-service.ts (runs in the router) to show
                  # currentDesiredCount/maxCapacity in the Confirmation_Dialog for the ECS_ScaleOut
                  # quick action. No RegisterScalableTarget/PutScalingPolicy permission.
                  - application-autoscaling:DescribeScalableTargets
                  # Read-only, used by preview-service.ts for the cost-optimization quick actions
                  # (EBS_ModifyVolumeType/CloudWatchLogGroup_SetRetention/ElasticIp_Release) to show
                  # the real AWS state before the user confirms in the Confirmation_Dialog. No mutate
                  # permission (ModifyVolume/PutRetentionPolicy/ReleaseAddress are granted ONLY to
                  # ActionExecutionRole below).
                  - logs:DescribeLogGroups
                  - ec2:DescribeAddresses
                  # Read-only, used by preview-service.ts for EC2_Rightsize (finding ec2LowCpu) to
                  # check real CPU architecture compatibility between the current and target instance
                  # type before showing the Confirmation_Dialog. No ModifyInstanceAttribute permission
                  # (granted ONLY to ActionExecutionRole below).
                  - ec2:DescribeInstanceTypes
                  # Read-only, used by get-ec2-instance-types.ts (Ec2_ChangeInstanceType picker, runs
                  # in RouterFunction) to list compatible instance types. Granted here rather than to
                  # ActionExecutionRole because RouterFunction is the real caller. This API does not
                  # support resource-level scoping, so Resource: '*' is required (same group as
                  # ec2:DescribeInstanceTypes above).
                  - ec2:DescribeInstanceTypeOfferings
                  # Topology (Infra Map): used only by the FALLBACK path of GET /topology when
                  # topology-cache.json does not exist or is broken (see handlers/get-topology.ts).
                  # All are free, so the request-path fallback incurs no cost (unlike
                  # cloudwatch:GetMetricData). Read-only.
                  - ec2:DescribeVpcs
                  - ec2:DescribeSubnets
                  - ec2:DescribeRouteTables
                  - ec2:DescribeNatGateways
                  # Transit Gateway + attachments, used to DRAW (not create) a TGW as a bridge node
                  # between the VPCs it is actually attached to (see
                  # collectors/topology-collector.ts::loadTransitGatewayPlacement/
                  # loadTransitGatewayEdges). Read-only and free, like the other ec2:Describe* above.
                  - ec2:DescribeTransitGateways
                  - ec2:DescribeTransitGatewayVpcAttachments
                  # Read-only, used by preview-service.ts for the backup-compliance quick actions
                  # (BackupVault_ApplyProtectionPolicy/BackupRestoreTesting_CreatePlan/
                  # Backup_RetryJob) to show the real AWS state (is the vault already protected, does
                  # the plan exist, which vault/role will be reused) before the user confirms in the
                  # Confirmation_Dialog. No mutate permission (PutBackupVaultAccessPolicy/
                  # CreateRestoreTestingPlan/CreateRestoreTestingSelection/StartBackupJob are granted
                  # ONLY to ActionExecutionRole below).
                  - backup:GetBackupVaultAccessPolicy
                  - backup:ListRestoreTestingPlans
                  # Read-only, used by preview-service.ts for the RDS_ApplyResourceGovernance quick
                  # action (finding rdsResourceGovernanceMissing) to show the current DB Parameter
                  # Group name and the parameters that will change before the user confirms. No
                  # ModifyDBParameterGroup permission (granted ONLY to ActionExecutionRole below).
                  - rds:DescribeDBParameters
                  - scheduler:ListSchedules
                  - scheduler:GetSchedule
                  - events:ListRules
                  - events:DescribeRule
                Resource: '*'
              # s3:ListAllMyBuckets: used only by the FALLBACK path of GET /topology (same as the
              # ec2:Describe* group above) to list S3 buckets as account-level resources on the Infra
              # Map (see collectors/topology-collector.ts::loadS3BucketPlacement). This API does not
              # support resource-level ARNs (it always returns ALL buckets of the account), so
              # Resource:'*' is required. It is a separate statement so it is clearly unrelated to the
              # two ARN-scoped s3:GetObject/PutObject statements right below. Read-only (List only),
              # it cannot read any bucket's contents, only learn that a bucket exists.
              - Effect: Allow
                Action: s3:ListAllMyBuckets
                Resource: '*'
              - Effect: Allow
                Action: s3:GetObject
                Resource:
                  - !Sub '${AssessmentReportBucket.Arn}/assessment-report.json'
                  - !Sub '${AssessmentReportBucket.Arn}/cost-cache.json'
                  - !Sub '${AssessmentReportBucket.Arn}/infra-cache.json'
                  - !Sub '${AssessmentReportBucket.Arn}/compliance-cache.json'
                  # topology-cache.json: network structure for the Infra Map, written by infra-collector.
                  # The router ONLY reads it (GetObject), never writes, unlike monitoring-cache.json.
                  - !Sub '${AssessmentReportBucket.Arn}/topology-cache.json'
              # monitoring-cache.json: lazy write-through cache written by the router itself (see
              # handlers/get-monitoring.ts), so it needs BOTH GetObject and PutObject. No collector
              # writes it. This way cloudwatch:GetMetricData cost is incurred only WHEN A REAL USER is
              # present, while the TTL still caps the cost when many tabs poll continuously.
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource: !Sub '${AssessmentReportBucket.Arn}/monitoring-cache.json'
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource: !Sub '${AssessmentReportBucket.Arn}/threshold-history/*'
        # --- Two statements for Resource_Action. NOT mutating: InvokeActionExecution only invokes
        # another Lambda (it does not mutate an AWS resource), and S3LifecycleReadOnlyForPreview is
        # read-only (Get*, no Put*), used by preview-service.ts running in this router Lambda to
        # build GET /actions/preview. RouterRole still has NO mutate permission
        # (ec2:CreateSnapshot/DeleteVolume/s3:PutBucketLifecycleConfiguration, nor ssm:GetParameter
        # for the service-token param); a static IAM structural test enforces this. ---
        - PolicyName: action-forwarding-and-preview
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: InvokeActionExecution
                Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt ActionExecutionFunction.Arn
              - Sid: InvokeScheduledActionsMutate
                Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt ScheduledActionsMutateFunction.Arn
              # Maker-checker Approval workflow (see shared/src/approval.ts): the router forwards
              # request/decide-approval to approval-mutate-fn (the ONLY place with s3:PutObject on
              # approvals/*, mirroring InvokeScheduledActionsMutate above). RouterRole itself only
              # gets READ access to that prefix (see ApprovalsReadOnly statement below) — it never
              # writes an Approval_Request directly, same invariant as action-audit/*.
              - Sid: InvokeApprovalMutate
                Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt ApprovalMutateFunction.Arn
              # Idle-to-Zero (see modules/idle-scheduler/): the router forwards register/deregister
              # to idle-scheduler-mutate-fn (the ONLY place with elasticloadbalancing:AddTags/
              # RemoveTags + cloudwatch:PutMetricAlarm/DeleteAlarms for this feature). RouterRole
              # itself only gets READ access (DescribeLoadBalancers/DescribeTags/DescribeInstances/
              # DescribeDBInstances/DescribeAlarms — all already granted above), mirroring every
              # other mutate-separation pattern on this role.
              - Sid: InvokeIdleSchedulerMutate
                Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt IdleSchedulerMutateFunction.Arn
              - Sid: S3LifecycleReadOnlyForPreview
                Effect: Allow
                # The correct IAM ACTION name is "s3:GetLifecycleConfiguration" (no "Bucket" between
                # "Get" and "Lifecycle"). The SDK call is GetBucketLifecycleConfigurationCommand, but
                # the IAM action has a different name; using the SDK name here causes AccessDenied for
                # EVERY bucket when preview-service.ts calls it, even though this statement exists.
                Action: s3:GetLifecycleConfiguration
                Resource: 'arn:aws:s3:::*'

        # --- Maker-checker Approval workflow (shared/src/approval.ts): GET /actions/approvals
        # (list, serves the Approvals queue page) and the read-before-execute check in
        # actions-execute-approval.ts both read approval-service.ts::getApproval/listApprovals
        # DIRECTLY inside the router — read-only, mirroring ActionAuditReadWrite's Resource shape
        # but WITHOUT s3:PutObject (that write permission lives ONLY on ApprovalMutateRole below —
        # see the static IAM test guarding this same invariant for action-audit/*). ---
        - PolicyName: approvals-read-only
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ApprovalsReadOnly
                Effect: Allow
                Action: [s3:GetObject, s3:ListBucket]
                Resource:
                  - !GetAtt AssessmentReportBucket.Arn
                  - !Sub '${AssessmentReportBucket.Arn}/approvals/*'

        # --- Logs viewer: the "Logs" tab reads log events through
        # cloudwatch-logs-viewer-service.ts running in this router Lambda. Read-only.
        # logs:DescribeLogGroups is already granted in the read-only-dashboard-sources statement
        # above, so it is not repeated here. This is a separate statement because its Resource is
        # narrower than Resource:'*' above: it is limited to log groups of this account/region.
        # RouterRole still has NO mutate permission: logs:PutRetentionPolicy is granted ONLY to
        # ActionExecutionRole. ---
        - PolicyName: logs-viewer-read-only
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: FilterLogEventsForLogsViewer
                Effect: Allow
                Action: logs:FilterLogEvents
                Resource: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:*'

        # --- Security Groups: the "Security Groups" tab lists SGs and ingress rules through
        # security-group-service.ts, and preview-service.ts re-reads SG state to serve
        # GET /actions/preview. Read-only.
        # Resource MUST be '*': ec2:DescribeSecurityGroups (like every ec2:Describe*) does not
        # support resource-level permissions, so it cannot be narrowed by ARN. A Condition on
        # ec2:Vpc could narrow it, but this dashboard must list the SGs of EVERY VPC in the account.
        # RouterRole still has NO mutate permission: ec2:AuthorizeSecurityGroupIngress/
        # RevokeSecurityGroupIngress are granted ONLY to ActionExecutionRole below (a static IAM
        # test guards this). ---
        - PolicyName: security-group-read-only
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: DescribeSecurityGroupsForListAndPreview
                Effect: Allow
                Action: ec2:DescribeSecurityGroups
                Resource: '*'

        # --- SSM Run Command: the "Run Command" tab polls command results through
        # ssm-run-command-status-service.ts running in this router Lambda. Read-only.
        # Why poll in the router and not through action-execution-fn: GetCommandInvocation is
        # read-only and the frontend polls every 2 seconds. Routing it through the mutating Lambda
        # would create a junk Action_Audit_Record on every poll and add an extra invocation cost.
        # Resource MUST be '*': ssm:GetCommandInvocation does not support resource-level ARNs (like
        # ssm:DescribeInstanceInformation, see the SSM IAM reference and the precedent in
        # PatchSchedulerRole). RouterRole still has NO mutate permission: ssm:SendCommand is granted
        # ONLY to ActionExecutionRole below (a static IAM test guards this). ---
        - PolicyName: ssm-run-command-read-only
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: GetCommandInvocationForRunCommandPolling
                Effect: Allow
                Action: ssm:GetCommandInvocation
                Resource: '*'

  # NO AWS::SSM::Parameter resource for either the external state-manager service token or the
  # Discord webhook URL: both are SecureString parameters, created/updated MANUALLY via
  # `aws ssm put-parameter --type SecureString` (see the Ec2StateManagerServiceTokenParamName /
  # DiscordWebhookUrlParamName parameter descriptions above), following the same pattern as
  # AgentClaudeApiKeyParamName. CloudFormation cannot create a SecureString parameter directly, and
  # passing the plaintext value through a CFN `String` parameter would expose it in CloudTrail and
  # stack events in plaintext.
  #
  # If an existing deployment still has `Type: String` parameters at
  # `/${Org}/${Project}/${Environment}/ec2-state-manager-service-token` and
  # `/${Org}/${Project}/${Environment}/discord-webhook-url`, run the `put-parameter --overwrite`
  # commands above BEFORE deploying this template. Every Lambda below reads with
  # `WithDecryption: true` (see discordWebhook.ts/ec2-state-manager-client.ts), which works
  # against BOTH String and SecureString parameters, so there is no hard ordering requirement, but
  # an unconverted String parameter keeps the value unencrypted until it is converted manually.

  SchedulerDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub '${Org}-${Project}-${Environment}-scheduler-dlq'
      # 14 days (the SQS maximum) gives enough time to investigate a persistently failing invoke
      # (throttle/timeout) before the message is deleted. Shared by all EventBridge Scheduler
      # targets: no per-schedule DLQ is needed because one Lambda failing only affects its own
      # message (the SQS message keeps the source payload, i.e. the schedule name).
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true
      Tags:
        - { Key: Environment, Value: !Ref Environment }
        - { Key: Project, Value: !Ref Project }
        - { Key: Lifecycle, Value: active }
        - { Key: Owner, Value: platform }

  # --- SNS: the ONLY topic that receives AlarmActions/OKActions for the whole standard alarm set
  # (managed by alarm-baseline-manager-fn). Its ONLY subscriber is discord-alarm-notifier-fn (a
  # Lambda); there is no email subscriber (the Discord webhook replaces SNS email entirely). ---
  #
  # OUT-OF-BAND RESOURCE NOTE: a second SNS topic (for example one named `<org>-security-alerts`)
  # may also deliver to `DiscordAlarmNotifierFunction` without being defined anywhere in this
  # template, neither the topic itself nor its Lambda subscription. A typical case is the
  # AlarmActions target of a standard CIS AWS Foundations Benchmark CloudTrail metric-filter alarm
  # pack (12 `CIS-*-Alarm` resources, namespace `CISBenchmark`) provisioned separately. Such
  # resources are not visible in `cfn drift-detection` against this template, are not torn down if
  # this stack is deleted, and are not reproduced by redeploying this template alone, which matters
  # when standing up a second environment/account. See `RUNBOOK_BY_METRIC`'s CIS section in
  # `shared/src/runbookCatalog.ts` and `lookupCisBenchmarkEvent` in `discord-alarm-notifier.ts` for
  # how those alarms are enriched with a runbook although they live outside this template.
  # Bringing the CIS alarm pack under this IaC (as `AWS::CloudWatch::Alarm` +
  # `AWS::Logs::MetricFilter` resources) would close the gap.
  AlarmNotificationTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub '${Org}-${Project}-${Environment}-alarm-notifications'
      DisplayName: 'ops-dashboard alarm notifications (-> Discord)'
      Tags:
        - { Key: Environment, Value: !Ref Environment }
        - { Key: Project, Value: !Ref Project }
        - { Key: Lifecycle, Value: active }
        - { Key: Owner, Value: platform }

  # --- IAM: discord-alarm-notifier-fn (SNS subscriber -> POST to the Discord webhook). Needs to
  # read 1 SSM parameter (the secret webhook URL) and ec2:DescribeInstances (to look up the Name
  # tag of the instance behind an alarm, so the Discord message shows the instance name next to
  # the InstanceId). DescribeInstances does not support scoping to a specific Resource ARN (only
  # Resource: '*'), as in ec2-collector.ts. ---
  DiscordAlarmNotifierRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${Org}-${Project}-${Environment}-alerting-notifier-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: discord-webhook-url-read
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${DiscordWebhookUrlParamName}'
              # SecureString requires kms:Decrypt separately from ssm:GetParameter, scoped via
              # kms:ViaService (not a specific key Resource ARN - the AWS-managed `alias/aws/ssm`
              # key's real ARN is account-specific, same rationale as AiOpsAgentRole's
              # DecryptClaudeApiKeyViaSsmOnly statement) so this grant cannot decrypt anything
              # outside an SSM GetParameter call.
              - Effect: Allow
                Action: kms:Decrypt
                Resource: '*'
                Condition:
                  StringEquals:
                    kms:ViaService: !Sub 'ssm.${AWS::Region}.amazonaws.com'
        - PolicyName: discord-alarm-ec2-name-lookup
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ec2:DescribeInstances
                Resource: '*'
        # CIS Benchmark alarm enrichment (lookupCisBenchmarkEvent in discord-alarm-notifier.ts):
        # re-queries CloudTrail for the specific API call/principal/IP/resource behind a
        # `CIS-*-Alarm` (namespace CISBenchmark) metric-filter count, which otherwise carries no
        # Dimensions at all. cloudtrail:LookupEvents does NOT support resource-level restriction
        # (same API-limitation pattern as ec2:DescribeInstances above - AWS-documented, not a
        # choice made here) - read-only, no write/delete action on the trail itself.
        - PolicyName: discord-alarm-cloudtrail-lookup
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: cloudtrail:LookupEvents
                Resource: '*'

  DiscordAlarmNotifierFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${Org}-${Project}-${Environment}-alerting-notifier-fn'
      Runtime: nodejs22.x
      Architectures: [arm64]
      Handler: index.handler
      Timeout: 15
      MemorySize: 128
      Role: !GetAtt DiscordAlarmNotifierRole.Arn
      Code: ./build/discord-alarm-notifier
      Environment:
        Variables:
          DISCORD_WEBHOOK_URL_PARAM_NAME: !Ref DiscordWebhookUrlParamName
      Tags:
        - { Key: Environment, Value: !Ref Environment }
        - { Key: Project, Value: !Ref Project }
        - { Key: Lifecycle, Value: active }
        - { Key: Owner, Value: platform }

  DiscordAlarmNotifierFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${DiscordAlarmNotifierFunction}'
      RetentionInDays: 30

  DiscordAlarmNotifierSnsPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref DiscordAlarmNotifierFunction
      Action: lambda:InvokeFunction
      Principal: sns.amazonaws.com
      SourceArn: !Ref AlarmNotificationTopic

  DiscordAlarmNotifierSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref AlarmNotificationTopic
      Protocol: lambda
      Endpoint: !GetAtt DiscordAlarmNotifierFunction.Arn

  # --- RDS event subscription -> the SAME topic the alarms already use, so RDS's own events reach
  # Discord through the notifier that is already wired up.
  #
  # WHY THIS EXISTS. A CloudWatch alarm can only see a METRIC. A whole class of RDS problems is not a
  # metric at all: it is an event. Without an event subscription, messages such as
  #     "Storage size N GiB is approaching the maximum storage threshold M GiB"
  # can be emitted repeatedly for days and reach nobody. The same silence would apply to a failed
  # backup, a forced failover, or a pending forced upgrade.
  #
  # WHY THESE CATEGORIES AND NOT ALL OF THEM. `availability` is deliberately EXCLUDED: instances
  # that are stopped every night to save cost would deliver two guaranteed notifications every
  # single day. A channel that carries a daily certainty is a channel people stop reading, and this
  # project already has noise suppression for the same reason (isAutoscalingScaleInNoise).
  # `backup`, `notification` and `configuration change` are excluded for the same reason: a nightly
  # restart re-applies Performance Insights and the monitoring interval, which would emit
  # configuration-change events daily.
  #
  # What is left is the set where a message means something is genuinely wrong or genuinely needs a
  # human: storage running out, a failure, a deletion, patching, and pending maintenance.
  RdsEventSubscription:
    Type: AWS::RDS::EventSubscription
    Properties:
      SubscriptionName: !Sub '${Org}-${Project}-${Environment}-rds-events'
      SnsTopicArn: !Ref AlarmNotificationTopic
      SourceType: db-instance
      # No SourceIds: every DB instance in the account is in scope. Naming instances here would mean a
      # newly created database is silently unmonitored, which is the failure mode this whole subscription
      # exists to remove.
      EventCategories:
        - low storage
        - failure
        - deletion
        - maintenance
        - security patching
      Enabled: true
      Tags:
        - { Key: Environment, Value: !Ref Environment }
        - { Key: Project, Value: !Ref Project }
        - { Key: Lifecycle, Value: active }
        - { Key: Owner, Value: platform }

  # --- Amazon GuardDuty: continuous threat detection (network/DNS/API-behavior anomalies, C2
  # traffic, credential compromise, port scanning) across the account - the ONE class of
  # "network/signal" problem no CloudWatch Alarm or RDS event subscription above can see, because
  # neither watches for MALICIOUS BEHAVIOR, only metric thresholds and RDS lifecycle events.
  #
  # NO AWS::GuardDuty::Detector RESOURCE HERE. GuardDuty allows only one detector per account/region.
  # If a detector already exists in the account (created before this stack and not managed by it),
  # creating a second `AWS::GuardDuty::Detector` fails with CREATE_FAILED / AlreadyExists, and an
  # existing detector may also have more data sources enabled (CloudTrail/DNSLogs/FlowLogs/S3Logs/
  # MalwareProtection/RdsLoginEvents/LambdaNetworkLogs) than a new one would default to. GuardDuty
  # findings are account-wide regardless of which detector produced them, so nothing below needs a
  # DetectorId: the EventBridge Rule matches on `source: aws.guardduty` /
  # `detail-type: GuardDuty Finding`, not on a specific detector. If your account has no detector,
  # enable GuardDuty first (console/CLI) or add the Detector resource yourself.
  #
  # COST-AWARENESS: GuardDuty bills per GB of VPC Flow Log/DNS/CloudTrail data it analyzes - see
  # https://aws.amazon.com/guardduty/pricing/. This is already being paid for by the existing
  # detector above regardless of what this stack does; the only NEW cost this stack introduces is
  # the EventBridge Rule + SNS forwarding below, both of which are effectively free at this volume
  # (EventBridge custom-bus rule matches and SNS publishes to an existing topic are pennies/month).

  # --- EventBridge Rule: forwards GuardDuty findings to the SAME AlarmNotificationTopic every
  # other alarm/RDS event already uses, so discord-alarm-notifier-fn (already wired up, already
  # gates VS a single Discord channel) delivers these too, with NO new Lambda/topic/subscriber.
  #
  # SEVERITY FILTER (severity >= 4, i.e. Medium and above): GuardDuty severity is a float from 0.1
  # to 8.9. Low-severity findings (<4) are frequently reconnaissance noise (a single port probe, a
  # benign anomaly) that GuardDuty itself documents as "informational" - forwarding EVERY finding
  # regardless of severity would flood the Discord channel exactly the way this project already
  # had to guard against once for ECS autoscaling noise (isAutoscalingScaleInNoise) and RDS
  # `availability` events (see the comment on RdsEventSubscription above). Medium+ is the
  # threshold GuardDuty's own console highlights as needing a human look.
  GuardDutyFindingsRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub '${Org}-${Project}-${Environment}-guardduty-findings'
      Description: >-
        Forwards GuardDuty findings with severity >= 4 (Medium/High) to AlarmNotificationTopic ->
        discord-alarm-notifier-fn. Low-severity (<4) findings are not forwarded, to avoid alert
        fatigue on reconnaissance-level noise.
      EventPattern:
        source: [aws.guardduty]
        'detail-type': ['GuardDuty Finding']
        detail:
          severity:
            - numeric: ['>=', 4]
      State: ENABLED
      Targets:
        - Arn: !Ref AlarmNotificationTopic
          Id: guardduty-findings-to-alarm-topic

  # --- SNS resource policy: EventBridge Rules require an EXPLICIT resource policy granting
  # events.amazonaws.com sns:Publish on the target topic (unlike an SNS subscription, which the
  # subscriber's OWN Lambda::Permission covers - see DiscordAlarmNotifierSnsPermission above).
  # Scoped via aws:SourceArn to EXACTLY this one rule's ARN - EventBridge cannot publish to this
  # topic on behalf of any other rule that might be added later without its own separate grant.
  AlarmNotificationTopicGuardDutyPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics:
        - !Ref AlarmNotificationTopic
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowGuardDutyFindingsRuleToPublish
            Effect: Allow
            Principal: { Service: events.amazonaws.com }
            Action: sns:Publish
            Resource: !Ref AlarmNotificationTopic
            Condition:
              ArnEquals:
                aws:SourceArn: !GetAtt GuardDutyFindingsRule.Arn

  # --- VPC Flow Logs: captures the ONE network signal GuardDuty above does NOT cover - traffic
  # actively REJECTED by a Security Group or Network ACL. GuardDuty tells you "this traffic looks
  # malicious"; Flow Logs (REJECT-only) tell you "this traffic never even got through your own
  # firewall rules" - useful for diagnosing misconfigured SGs/NACLs and confirming a suspected
  # port-scan/probe was actually blocked, not just detected after the fact.
  #
  # GATED BY VpcFlowLogsEnabled (default 'false' - opt-in, not on by default) because this is
  # billed per-GB ingested (~$0.50/GB in ap-southeast-1, see
  # https://aws.amazon.com/vpc/pricing/ under "VPC Flow Logs"), unlike GuardDuty's foundational
  # data sources which read the SAME underlying flow data for free as part of GuardDuty's own
  # price. TrafficType is REJECT-only (never ACCEPT/ALL) specifically to keep this bounded - a
  # healthy VPC's traffic is overwhelmingly ACCEPT, so capturing it would multiply ingest cost for
  # little added detection value versus the REJECT-only signal this exists to provide.
  #
  # Destination: CloudWatch Logs (not S3) - matches every other log group in this stack
  # (RetentionInDays: 30, same as RouterFunctionLogGroup etc.) so an operator finds Flow Logs in
  # the same place (CloudWatch Logs console) as every other Lambda log, no separate S3
  # prefix/lifecycle rule to maintain.
  VpcFlowLogsRole:
    Type: AWS::IAM::Role
    Condition: IsVpcFlowLogsEnabled
    Properties:
      RoleName: !Sub '${Org}-${Project}-${Environment}-vpc-flow-logs-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: vpc-flow-logs.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: vpc-flow-logs-deliver-to-cloudwatch
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - logs:DescribeLogGroups
                  - logs:DescribeLogStreams
                Resource: !GetAtt VpcFlowLogsGroup.Arn

  VpcFlowLogsGroup:
    Type: AWS::Logs::LogGroup
    Condition: IsVpcFlowLogsEnabled
    Properties:
      LogGroupName: !Sub '/${Org}/${Project}/${Environment}/vpc-flow-logs-reject'
      RetentionInDays: 30

  VpcFlowLogPrimary:
    Type: AWS::EC2::FlowLog
    Condition: IsVpcFlowLogsEnabled
    Properties:
      ResourceType: VPC
      ResourceId: !Ref VpcIdPrimary
      TrafficType: REJECT
      LogDestinationType: cloud-watch-logs
      LogGroupName: !Ref VpcFlowLogsGroup
      DeliverLogsPermissionArn: !GetAtt VpcFlowLogsRole.Arn
      Tags:
        - { Key: Environment, Value: !Ref Environment }
        - { Key: Project, Value: !Ref Project }
        - { Key: Lifecycle, Value: active }
        - { Key: Owner, Value: platform }

  VpcFlowLogSecondary:
    Type: AWS::EC2::FlowLog
    Condition: IsVpcFlowLogsEnabled
    Properties:
      ResourceType: VPC
      ResourceId: !Ref VpcIdSecondary
      TrafficType: REJECT
      LogDestinationType: cloud-watch-logs
      LogGroupName: !Ref VpcFlowLogsGroup
      DeliverLogsPermissionArn: !GetAtt VpcFlowLogsRole.Arn
      Tags:
        - { Key: Environment, Value: !Ref Environment }
        - { Key: Project, Value: !Ref Project }
        - { Key: Lifecycle, Value: active }
        - { Key: Owner, Value: platform }

  # --- IAM: alarm-baseline-manager-fn (the "standard alarm set"). Needs read-only Describe* on
  # EC2/RDS/ALB/ECS (to survey online resources, same permissions RouterRole/
  # InfraReviewCollectorRole already have, nothing broader) plus Put/Describe/DeleteAlarms on
  # CloudWatch (alarm management, free tier, unlike the billed GetMetricData that
  # InfraReviewCollectorRole is granted). ---
  AlarmBaselineManagerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${Org}-${Project}-${Environment}-alerting-baseline-manager-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: alarm-baseline-discover-resources-read-only
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ec2:DescribeInstances
                  - rds:DescribeDBInstances
                  - elasticloadbalancing:DescribeLoadBalancers
                  - elasticloadbalancing:DescribeTargetGroups
                  - ecs:ListClusters
                  - ecs:ListServices
                  - ecs:DescribeServices
                Resource: '*'
        - PolicyName: alarm-baseline-manage-alarms
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - cloudwatch:DescribeAlarms
                  - cloudwatch:PutMetricAlarm
                  - cloudwatch:DeleteAlarms
                  # ListMetrics (free, RouterRole already has it): used to learn which metrics the
                  # CloudWatch Agent ACTUALLY publishes in the CWAgent namespace, so disk/memory
                  # alarms are created only for those series. Creating alarms from the instance list
                  # instead of the real metrics would leave instances without the agent with a
                  # permanent INSUFFICIENT_DATA alarm, the very problem this standard set avoids.
                  - cloudwatch:ListMetrics
                Resource: '*'
        - PolicyName: alarm-baseline-manager-discord-webhook
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${DiscordWebhookUrlParamName}'
              # SecureString requires kms:Decrypt separately from ssm:GetParameter, scoped via
              # kms:ViaService (not a specific key Resource ARN - the AWS-managed `alias/aws/ssm`
              # key's real ARN is account-specific, same rationale as AiOpsAgentRole's
              # DecryptClaudeApiKeyViaSsmOnly statement) so this grant cannot decrypt anything
              # outside an SSM GetParameter call.
              - Effect: Allow
                Action: kms:Decrypt
                Resource: '*'
                Condition:
                  StringEquals:
                    kms:ViaService: !Sub 'ssm.${AWS::Region}.amazonaws.com'

  AlarmBaselineManagerFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${Org}-${Project}-${Environment}-alerting-baseline-manager-fn'
      Runtime: nodejs22.x
      Architectures: [arm64]
      Handler: index.handler
      Timeout: 60
      MemorySize: 256
      Role: !GetAtt AlarmBaselineManagerRole.Arn
      Code: ./build/alarm-baseline-manager
      Environment:
        Variables:
          ALARM_NOTIFICATION_TOPIC_ARN: !Ref AlarmNotificationTopic
          DISCORD_WEBHOOK_URL_PARAM_NAME: !Ref DiscordWebhookUrlParamName
