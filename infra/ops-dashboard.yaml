      AlarmDescription: 'SecurityPublicBucketGuardianFunction Errors >= 1 - check CloudWatch Logs.'
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref SecurityPublicBucketGuardianFunction
      Statistic: Sum
      Period: 86400
      EvaluationPeriods: 1
