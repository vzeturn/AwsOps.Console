  # --- IAM: security-endpoint-drift-detector-fn (rate(1 day), SSM RunCommand: flags an untagged
  # VPN/tunnel process on any SSM-managed instance, see the security-endpoint-drift-detector.ts
  # file header). Same ssm:DescribeInstanceInformation/SendCommand/GetCommandInvocation shape as
  # PatchSchedulerRole, but SendCommand is scoped to AWS-RunShellScript (this Lambda only reads
  # process state, never RunPatchBaseline/mutates anything) + ec2:DescribeInstances (reads the
  # SecurityException tag, does NOT write any tag; this Lambda is read-only end to end). ---
  SecurityEndpointDriftDetectorRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${Org}-${Project}-${Environment}-security-endpoint-drift-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: endpoint-drift-discover-and-run
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ec2:DescribeInstances
                Resource: '*'
              - Effect: Allow
                Action: ssm:DescribeInstanceInformation
                Resource: '*'
              - Effect: Allow
                Action: ssm:SendCommand
                Resource:
                  - !Sub 'arn:aws:ssm:${AWS::Region}::document/AWS-RunShellScript'
                  - !Sub 'arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:instance/*'
              - Effect: Allow
                Action: ssm:GetCommandInvocation
                Resource: '*'
        - PolicyName: endpoint-drift-discord-webhook
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${DiscordWebhookUrlParamName}'
              - Effect: Allow
                Action: kms:Decrypt
                Resource: '*'
                Condition:
