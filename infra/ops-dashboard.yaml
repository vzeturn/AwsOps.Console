      OKActions:
        - !Ref AlarmNotificationTopic

  # --- IAM: approval-mutate-fn (maker-checker Approval workflow, shared/src/approval.ts) — mirrors
  # ScheduledActionsMutateRole exactly (same "router never mutates, only invokes" pattern). ONLY
  # this role gets s3:PutObject on approvals/* — RouterRole gets read-only (see ApprovalsReadOnly
  # statement on RouterRole above). ---
  ApprovalMutateRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${Org}-${Project}-${Environment}-action-approval-mutate-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: approval-mutate-write-read
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ApprovalReadWrite
                Effect: Allow
                Action: [s3:PutObject, s3:GetObject, s3:ListBucket]
                Resource:
                  - !GetAtt AssessmentReportBucket.Arn
                  - !Sub '${AssessmentReportBucket.Arn}/approvals/*'

  ApprovalMutateFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${Org}-${Project}-${Environment}-action-approval-mutate-fn'
      Runtime: nodejs22.x
      Architectures: [arm64]
